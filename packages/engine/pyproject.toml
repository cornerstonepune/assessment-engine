[project]
name = "cornerstone-engine"
version = "0.1.0"
description = "Cornerstone assessment engine: generation, rendering, marking, graph"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "boto3>=1.35", # Textract: the transcription layer (ADR 0019)
    "certifi>=2024.8",
    "fastapi>=0.115",
    "jsonschema>=4.26.0",
    "numpy>=2.0",
    "opencv-contrib-python>=4.10", # the one OpenCV: PaddleX pins this build, and two cv2 packages overwrite each other
    "playwright>=1.48",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pymupdf>=1.24",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "segno>=1.6",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
    "zxing-cpp>=3.1.1",
    "paddleocr>=3.7",
    "paddlepaddle>=3.3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.14"]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["engine"]

[tool.ruff]
# 110 is the width this engine was written at; 88 would rewrap every line in the repository and
# call it formatting. The predictor registries are wrapped in `# fmt: off` where one line per
# misconception is the point — `ruff format` would turn 27 readable rows into 130 lines.
line-length = 110

[tool.ruff.lint]
# The classes that are defects, named explicitly so a ruff upgrade cannot silently turn taste into a
# CI failure: pycodestyle errors and warnings, pyflakes, and import order. Deliberately not selected:
# C4/B/PL/SIM/PERF/UP, which argue about dict() versus {} and other matters of preference.
select = ["E", "W", "F", "I"]
# E501 is the formatter's job and only fires where the formatter deliberately cannot act — inside a
# long comment or a string it must not break. Selecting both makes 114 unfixable findings out of a
# width that is already enforced on every commit by `ruff format --check`.
ignore = ["E501"]
