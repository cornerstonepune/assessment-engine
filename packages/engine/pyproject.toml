[project]
name = "cornerstone-engine"
version = "0.1.0"
description = "Cornerstone assessment engine: generation, rendering, marking, graph"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "certifi>=2024.8",
    "jsonschema>=4.26.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "playwright>=1.48",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "segno>=1.6",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["engine"]
