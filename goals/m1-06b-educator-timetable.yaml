name: m1-06b-educator-timetable
goal: >
  The educator opens her day and sees the generated timetable for her class and nobody else's: a command turns the
  school's own tabs (the Time table, the Monthly Planner, the Pre-Primary calendar) into the rows of the six timetable
  tables for Fortnight 10 to 17, safe to run twice, printing counts and not text, listing every day and fortnight the
  sources disagree about and every planner line with no period, and able to write the same rows as one SQL file that
  can be applied to live; three read calls (her day, her week, one period with its activity) answer only for a class
  she holds, refuse while `educator.timetable_enabled` is off, and carry no child and no name; a planner line is linked
  to an activity only when it names exactly one, by code and never by a model.
# Written 2026-11-04 (data rework the same day: inputs are now exact exports of the three tabs), before the code: task M1-06 part 2 (decisions D-018, D-028, D-061; design in
# docs/notes/m1-06-k2-plan-timetable.md; response shapes agreed with the session building the screens). W2 step N4, files
# only, no thirteenth step. The dated calendar says Fortnight 10 ends 6 Dec and Fortnight 11 starts 7 Dec; the Graph tab
# says 7 Dec and 8 Dec: Monday 7 Dec is passed to the command as undecided and gets no session. A holiday marked for
# (PG - N) only is not a K2 holiday; one marked Tentative is loaded and says so. Nimish's words: the one sentence below,
# exactly as D-061 records it (teacher-os blueprint/decisions.md).
