manual:
  - "Loaded Fortnight 10 to 17 from the exact tab exports (supabase/seed/k2_tabs_2026_11_04/) into a local copy: counts printed, second run adds nothing. Applying the SQL to live is the orchestrator's, in one transaction, with a before and after count."
  - "The K2 educator confirms the reading that settled Fortnight 10: week A (23-27 Nov) from the November block's planner row, week B (30 Nov-4 Dec) from the December block's."
  - "The K2 educator's line-by-line marks of the generated 23 Nov to 6 Dec timetable (D-028): not claimed until she has made them."
  - "A person confirms: the K2 class and section on live, which timetable tab is current, where Block Room goes, planner Fortnights 10 to 17 are current, Saturdays."
