name: staffload_a_table_of_staff
goal: >
  Nimish gives a table of teachers with their subjects and grades, and one command on his own Mac puts them all on
  the staff list: `engine staff load PATH` shows, for every row, what it would do and changes nothing; the same with
  `--apply` adds the new people and sets the classes and subjects of the ones already there, in one transaction. A
  new person gets a one-time password made by code and shown once in his terminal; a person already holding a password
  keeps it; no one missing from the table is touched. The table stays outside the repository, as the class list does.

# Written 2026-10-27, before the code. A setup tool for the site's sign-in, not a step of the workflow: no gate of
# BUILD-ORDER moves (as goals/auth-email-password.yaml). No migration: it writes the `app.staff` row the other staff
# commands write, with the `subjects` a coordinator already sets on the Staff page. The orchestrator cannot reach the
# live database, so the last run is Nimish's.
says:
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_csv_or_a_table_pasted_from_a_spreadsheet_is_read_and_a_missing_column_is_refused_in_words"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_dry_run_changes_nothing_and_says_what_each_row_would_do"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_every_refusal_is_said_in_words_and_one_refused_row_stops_the_apply"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_subject_is_read_by_its_code_or_its_name_and_the_dry_run_says_which_code"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_apply_adds_updates_leaves_the_others_and_a_second_run_changes_nothing"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_person_who_already_has_a_password_keeps_it_and_is_given_none"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_new_password_is_made_by_code_hashed_as_the_site_checks_and_shown_once_only"
  - words: "I will give you a table of teachers and subjects and grades and you then do the needful."
    proved_by: "packages/engine/tests/test_staff_load.py::test_a_passwords_file_is_private_and_outside_the_repository"
manual:
  - "Nimish runs `bin/engine staff load PATH` on his Mac against the live database, reads the table it prints, then runs
    it again with `--apply`, and gives each new person their password himself, in person or by phone."
  - "The table file (names and emails) stays outside the repository. It never passes through Claude or git."
scenarios: []
criteria:
  - name: the staff commands and the loader
    run: cd packages/engine && uv run pytest -q tests/test_staff.py tests/test_staff_load.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
