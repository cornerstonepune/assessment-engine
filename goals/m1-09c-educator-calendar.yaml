  - words: "All parts should just function like a well-oiled machine, right?"
    proved_by: "apps/web/tests/m1-09-tokens.spec.ts::every token the educator's screens name is in tokens.css"
  - words: "All parts should just function like a well-oiled machine, right?"
    proved_by: "apps/web/tests/m1-09-tokens.spec.ts::the educator's screens write no colour, size or font of their own: only the tokens"
