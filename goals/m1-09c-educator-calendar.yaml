    proved_by: "apps/web/tests/m1-09-calendar.spec.ts::while the timetable is switched off Today, This week and a period are not found"
  - words: "All parts should just function like a well-oiled machine, right?"
    proved_by: "apps/web/tests/m1-09-calendar.spec.ts::Today is the day as a calendar: every period a block in time order, its time as time, the school's words, a chip only on work"
