name: m1-09c-educator-calendar
goal: >
  A K2 educator, on a desktop or a phone, sees her day as a calendar (every period a block with its time as time, the
  school's words for it, a Now line today, the next period with a countdown) and her week as a grid (a column a day, a
  row a period, a holiday one cell, today's column grey, no chip on a cell still to come); every block opens its period
  (the school's words, the planner's lines for the subject this fortnight, its activity); a strip of counts heads each
  page and every count opens what it counts; her menu is a sidebar with submenus (tabs at the foot of a phone) and a
  breadcrumb says where she is. White ground, the school's tokens only (D-073, D-075). From M1-06's /timetable routes,
  behind the switch and the staff preview (D-076).
# Written 2026-11-05 (D-076: build the screens now, in the real app; D-075's rules). The activity page and materials are
# their own PRs. No migration.
