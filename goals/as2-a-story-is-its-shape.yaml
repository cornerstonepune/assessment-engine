  - words: "same process"
    proved_by: packages/engine/tests/test_story_keys.py::test_both_ways_into_the_bank_key_a_story_alike
  - words: "Everything should have something."
    proved_by: packages/engine/tests/test_story_keys.py::test_a_stored_story_is_keyed_again_and_what_names_it_follows
  - words: "same process"
