name: as2-a-story-is-its-shape
goal: >
  A story is its numbers, its shape and its operations; its words are not. Two stories with the same numbers and
  different shapes (7 − 3 as a take-away, as a comparison, as a start no one knows) are two questions, so a level of
  small numbers holds every story shape it lists when it is filled whole: SUB.1D1D's Advance holds W02, W03 and W11
  beside W04, W05, W08 and W09, and ADD.1D1D's holds W06 beside W01, W07 and W10. A two-step story is keyed by its
  operations too, so two templates of one shape whose answers differ are never one question. Both ways into the bank
  key a story alike. Every story already stored is keyed again, once, by `engine bank rekey`, which update-live runs
  before anything reads a story's shape: no question's words, numbers or answer change; the reviews and gold findings
  that name a story follow it, and a key it had still leads to it (a proposal in its append-only ledger, a gold file, a
  bookmarked page, a copy printed before, whose boxes it still reads); a rewording keeps its own key and takes its
  story's shape, so a relabel no longer loses it and the refill no longer retires it; a retired story stays retired
  under its new key; and a second run changes nothing. The rehearsal on a copy of live runs what update-live runs.
# Written 2026-10-10, before the code: slice AS2 of BUILD-ORDER "Inserted now: multiplication and division", the
# rejected option of ADR 0011, its trigger met. Measured first (STATE.md "AS2 — measured before the build"): filled
# whole as a scenario fills it, three seeds each, SUB.1D1D's Advance holds W11, W02 and W03 0 times and ADD.1D1D's
# holds W06 0 times; the story cases listed first take every number pair.
says:
