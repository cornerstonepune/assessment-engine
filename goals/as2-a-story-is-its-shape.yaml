manual:
  - "On live, once merged: `bin/update-live`. Step 5 runs `bank rekey` first, before `bank relabel` reads a story's
    shape; it prints how many stories it keyed again, how many reviews and gold findings followed them, how many
    rewordings took their story's shape, and how many stories whose words no template wrote keep their key. `bank
    refill` then fills SUB.1D1D's and ADD.1D1D's Advance with the shapes they lacked."
scenarios:
  - name: SUB.1D1D, Advance — filled whole, every story shape it lists
    skill_set: SUB.1D1D
    difficulty: Advance
    n: 108
    cases: [S03, S04, M21, M22, M23, W04, W05, W08, W09, W11, W02, W03]
  - name: ADD.1D1D, Advance — filled whole, every story shape it lists
    skill_set: ADD.1D1D
    difficulty: Advance
    n: 216
    cases: [A02, A04, M01, M02, W01, W07, W10, W06, K02]
