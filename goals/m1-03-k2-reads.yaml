name: m1-03-k2-reads
goal: >
  The engine answers, in one fast call each, every question the K2 screens ask, and says only what the rules allow.
  Part A: an educator's to-do (her notes to confirm, her notes with a problem to fix, her notes left unconfirmed after
  48 hours, oldest first) and the coordinator's list (only what needs a decision, red first: notes with problems and
  notes left unconfirmed as rows; late, unplanned and no-notes as counts; never a name, a child only by Sr. No.).
  Part B (reads the child's state per skill that M1-02 put on main): the K2 class picture (children by Sr. No.
  by skills, each cell the state, level shown and last-seen day; an empty cell is "not seen", never a failure) and
  one child's page (skills in date order, each with the sentence she wrote). No call returns "not willing" or an
  internal label; "not seen" is never "not secure"; every call answers under a second for a class of 22 with 20 skills
  and asks the database a fixed number of times however many children there are.
# Written 2026-11-03, before the code: task M1-03 (orchestrator brief; teacher-os decisions O-13 children as numbers,
# D-008 not seen is not not secure). W3 step N9/N10 reads; no migration (queries in code). Part A depends only on
# #362. Part B reads child_observed_state (#364) on a class of 22 with 20 skills made of real observations.
