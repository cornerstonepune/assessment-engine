name: md3b2-divide-advance
goal: >
  The column skills' Advance levels, DIV.2D1D (Grade 3) and DIV.3D1D (Grade 4), hold every box, estimate and check the
  drafted document places on them, each drawn from its level's own numbers as a straight question is: on DIV.2D1D a
  digit missing in the number divided, the remainder missing, the divisor missing with a remainder, whether an answer
  could be right, and a division checked by multiplying; on DIV.3D1D a digit missing in the quotient, how many digits a
  quotient has before it is worked, an estimate with the number divided rounded to the nearest hundred, and ÷ 5 as ÷ 10
  then doubled. Each box has exactly one answer and names the mistakes a child makes finding it, by the act that finds
  it: a digit in the number divided is found by multiplying, a remainder by taking away, and each names that act's
  mistakes; a digit in the quotient names the division's own mistakes whose quotient fits the boxes printed; a box worked
  in another operation never names "wrong operation". A claimed answer is right or a named mistake's, one as often as
  the other. How many digits is never answered by the boxes it prints. The mistake found and the remainder stories
  wait for M3b3, named. Every question is, as measured, a case of its level, its answer recomputed, every wrong answer a
  named mistake, none held by two levels, and every level fills its worksheets. None of it is taught until an educator
  says so.
# Written 2026-10-10, before the code: slice M3b2 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M3b2 — measured before the build"): none of the 16 kind cases the document places on these
# two Advance levels draws a question its level can hold, and V04 and V10 drawn alone crash. What a box can name was
# measured over every question each level can hold: a digit missing in the number divided names nothing on 66 of 212
# 2-digit questions by the division's mistakes alone, and every one when it is keyed by the multiplication that finds
# it; the remainder's box, with the quotient printed, names nothing by any division mistake (556 of 556), and every
# question by the taking away that finds it. So a box is keyed by the act that finds it, as ADR 0057 keyed a box in the
# other operation. The document places only kinds on these levels; they list no straight case Hard holds. M3b is three
# slices: finding the mistake needs a module of its own (diagnosis.py is at 397 lines) and the remainder stories need
# template rows and a mistake no row holds, so both are M3b3's.
