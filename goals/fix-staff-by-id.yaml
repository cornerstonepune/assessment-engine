  - words: "Names stay in pii (CLAUDE.md rule 6)"
    proved_by: "packages/engine/tests/test_people_signer.py::test_the_staff_import_refuses_a_signer_who_is_not_on_the_list_and_writes_nothing"
  - words: "Names stay in pii (CLAUDE.md rule 6)"
    proved_by: "packages/engine/tests/test_people_signer.py::test_only_the_staff_import_may_name_a_signer_before_the_staff_exist"
  - words: "Names stay in pii (CLAUDE.md rule 6)"
