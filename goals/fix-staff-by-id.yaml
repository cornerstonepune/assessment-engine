name: fix-staff-by-id
goal: >
  Who signed a people load is a staff id, never a typed name or email. `engine staff import` and `engine enrol k2` take
  `--by <the signer's email>`; the engine looks that email up (public.staff_of_email) and writes the staff id, as text, in
  staff_role_grant.granted_by and enrolment.recorded_by, the two columns the website can read. A `--by` that is nobody on
  the staff tables (or two people) is refused in plain words before any write, in a dry run too, without repeating what
  was typed. The first `staff import` is how staff exist at all, so its signer may be someone on the website's sign-in
  list who the same run adds: the id is looked up after they are in. No name or email lands in any column of the
  people tables after a full import and enrolment, and no report prints a staff email or name or a child's name.
# Written 2026-11-03, before the code: the architecture council gate found `--by "<name>"` stored as text in two
# website-readable columns (D-046: staff by id; CLAUDE.md rule 6). Nimish loads the real K2 class list with
# `--apply --by <his email>`, so this lands first. No migration: the columns are text, and hold the staff id.
# Placeholder people only (ann@example.test, "Placeholder Ann"); the test database only; nothing touches live.
says:
