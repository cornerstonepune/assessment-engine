  - words: "Names stay in pii (CLAUDE.md rule 6)"
    proved_by: "packages/engine/tests/test_people_signer.py::test_no_name_or_email_is_in_any_text_column_of_the_people_tables_after_a_full_load"
  - words: "Names stay in pii (CLAUDE.md rule 6)"
    proved_by: "packages/engine/tests/test_people_signer.py::test_no_report_prints_the_signers_email_or_name_or_a_childs_name"
