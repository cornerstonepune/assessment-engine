name: md4d1-times-stories
goal: >
  MD.WORD (Grades 2 to 4) asks for the stories of × and ÷. Easy, Grade 2: equal groups, how many in all; sharing, how
  many in each; grouping, how many groups; the cost of many. Medium, Grade 2: an array, how many in all and how many in a
  row; the cost of one; twice as many; and half as many (Meera read 30 pages, Aman half as many). Hard, Grade 3: times
  as many, the larger, the smaller (Dev has 12, 3 times as many as Riya) and how many times (Dev has 12, Riya 4); a
  remainder dropped, rounded up, asked, or both. Advance, Grade 4: combinations and area in squares; the two-step
  stories, × then + (3 boxes of 12 pencils and 5 loose), × then − (₹100, 4 pens at ₹15), ÷ then × (12 pencils cost
  ₹36: what do 5 cost?), two products added (4 packets of 6 and 3 of 8), + then ÷ (18 red and 14 blue balloons shared
  by 4) and a bar model (Ria and Sam have 32 marbles, Sam 3 times as many as Ria); a story with a number it does not
  need (8 boxes of 9 mangoes and 3 drivers) and a price list read (pen ₹15, eraser ₹5: what do 3 pens cost?). Each new
  story says the range its numbers may take, so its numbers make sense. Every question names a mistake its wrong answer
  shows: one step only, the other operation, and six new, drafted for Achal: multiplying because the story says
  "times" when it asks for the smaller, doubling for half as many, how many more answered for how many times, the
  number the story does not need used, the other item's price read, and a bar model divided by the times with the
  smaller one's own part left out. The scenario works out every story's answer
  from its own numbers. Every level fills and every scenario is 100%. None of it is taught until an educator says so.
# Written 2026-10-11, before the code: slice M4d1 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M4d — measured before the build"): of MD.WORD's 26 cases, sixteen draw; B09, B10, B27 have no
# template; B18–B23 fail (no size in their rule, and the two-step maker works its first step with + or − only); B25 and
# B26 have no × template. The school's objective "Solve multi-step word problems using bar models" is at Grades 2, 3 and
# 4 (LO-G2-0530, LO-G3-0959, LO-G4-1356), on NUM.OPS.03 and NUM.OPS.04.
