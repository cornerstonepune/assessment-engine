manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads MD.WORD into a topic of its own,
    Stories with × and ÷, and fills its levels. No screen or paper shows it until an educator switches it on from
    Curriculum for a grade, and its skill set waits for one approval on the Skill Map."
scenarios:
  - name: MD.WORD, Easy — equal groups, sharing, grouping, the cost of many
    skill_set: MD.WORD
    difficulty: Easy
    n: 48
    cases: [B01, B02, B03, B06]
  - name: MD.WORD, Medium — arrays, the cost of one, twice and half as many
    skill_set: MD.WORD
    difficulty: Medium
    n: 60
    cases: [B04, B05, B07, B11, B27]
  - name: MD.WORD, Hard — times as many, and a remainder used as the story needs
    skill_set: MD.WORD
    difficulty: Hard
    n: 84
    cases: [B08, B09, B10, B14, B15, B16, B17]
  - name: MD.WORD, Advance — two steps, a number not needed, a price list
    skill_set: MD.WORD
    difficulty: Advance
    n: 120
    cases: [B12, B13, B18, B19, B20, B21, B22, B23, B25, B26]
criteria:
  - name: × and ÷ stories drawn, printed and marked; the drawer, the stories and the checks they touch
    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_md_word.py tests/test_divide_stories.py tests/test_mul_advance.py tests/test_mul_models.py tests/test_div_models.py tests/test_story_keys.py tests/test_story_shape.py tests/test_every_listed_case.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_new_kinds.py tests/test_every_skill.py tests/test_mistake_rows.py tests/test_items.py tests/test_render.py tests/test_question.py tests/test_loaders.py tests/test_bank.py tests/test_library.py tests/test_asks.py tests/test_audit.py tests/test_goal.py
    expect: "passed"
  - name: the drafted document recomputed and checked
    run: packages/engine/.venv/bin/python research/md_taxonomy.py --check
    expect: "0 faults"
  - name: the Question bank shows every × and ÷ story as the child meets it
    run: cd apps/web && npx playwright test tests/s40-stories.spec.ts
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
