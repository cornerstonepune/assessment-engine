name: auth-email-password
goal: >
  A member of staff signs in with their school email and a password only they know, and sets that password themselves.
  "Forgot your password?" on the sign-in page sends a one-time link to a staff email and says the same words whatever
  email was typed, so the form never tells anyone who is staff. The link opens "Set a new password", works once, runs
  out after `password_link.reset_minutes`, and dies the moment a newer link is asked for or the password changes; a new
  password must be at least `password.min_length` characters, not the person's own email, and not one of the commonest
  passwords. Setting a password ends every other session that person had open. A signed-in person changes their own
  password with their current one from the account menu. A new member of staff is added on the Staff page and gets the
  same kind of link, good for `password_link.first_days` days: nobody types or sees anyone else's password. No 2FA, no
  social sign-in.

# Written 2026-10-26, before the code. Nimish closed the Google sign-in (PR #265) the same day. No gate moves: this is
# the sign-in gate of W1–W3's site, not a step of the workflow (BUILD-ORDER). What is still manual, and what the owner
# must set before an email can leave Vercel, is in docs/notes/auth-email-password.md.
says:
  - words: "We will have to have a proper email password login"
    proved_by: "apps/web/tests/gate.spec.ts::a right password signs you in and lands on What needs doing"
  - words: "with an option to forget password and all"
    proved_by: "apps/web/tests/gate-password.spec.ts::forgot your password says the same words for a staff email and for one that is nobody's"
  - words: "with an option to forget password and all"
    proved_by: "apps/web/tests/gate-password.spec.ts::the emailed link sets a new password, which signs that person in"
  - words: "no leaking who is staff"
    proved_by: "apps/web/tests/gate-password.spec.ts::a staff email and an unknown one are answered in the same time, so the wait never says who is staff"
  - words: "The link works once"
    proved_by: "apps/web/tests/gate-password.spec.ts::a link already used, and a link a newer one replaced, both open nothing"
  - words: "The new password is checked"
    proved_by: "apps/web/tests/gate-password.spec.ts::a password too short, the person's own email, or a common one is refused"
  - words: "After a reset, every other open session of that person is ended."
    proved_by: "apps/web/tests/gate-password.spec.ts::a session open elsewhere is signed out once the password is set"
  - words: "A signed-in person can change their own password (current password required) from their account menu."
    proved_by: "apps/web/tests/gate-password.spec.ts::a signed-in person changes their own password, and the old one stops working"
  - words: "No one ever types or sees another person's password."
    proved_by: "apps/web/tests/gate-password.spec.ts::a new member of staff added on the Staff page has no password and is sent a first-time link"
  - words: "Remove the \"Ask Nimish for a password\" text."
    proved_by: "apps/web/tests/gate-password.spec.ts::the sign-in page offers the forgotten-password link and no longer sends anyone to Nimish"
  - words: "Rate limit the forgot-password form per email and per IP using the existing limit mechanism"
    proved_by: "packages/engine/tests/test_password_rules.py::test_the_forgot_form_counts_what_was_asked_for_per_email_and_per_address"
  - words: "store ONLY a hash of the token"
    proved_by: "packages/engine/tests/test_password_rules.py::test_a_link_is_kept_as_a_hash_and_the_website_may_only_spend_one"
  - words: "the engine must record a clear, secret-free line \"mail is not configured\" in the site's health check"
    proved_by: "packages/engine/tests/test_password_rules.py::test_mail_that_is_not_configured_is_said_in_the_health_check_with_no_secret"
  - words: "a threshold row, not a constant"
    proved_by: "packages/engine/tests/test_password_rules.py::test_every_number_and_the_common_list_are_rows_and_seed_files"
  - words: "No 2FA needed for now, keep it simple."
    proved_by: "packages/engine/tests/test_password_rules.py::test_nothing_was_added_but_a_password"
manual:
  - "The mail sender: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD and SMTP_FROM are set in Vercel by Nimish. Until they are, the forgot-password form answers as it always does and `engine live watch` says `mail is not configured, so N set-password links of the last 1440 minutes were never sent`, so nobody is left waiting for an email in silence."
  - "This migration needs `rehearse-update-live.yml` run on the branch before merge (two new tables)."
scenarios: []
criteria:
  - name: the link, the limits, the health line, and the rows behind them
    run: cd packages/engine && .venv/bin/python -m pytest -q -p no:cacheprovider -o addopts= tests/test_password_rules.py
    expect: "passed"
  - name: the website writes only what a person changes on it, the new tables included
    run: cd packages/engine && .venv/bin/python -m pytest -q -p no:cacheprovider -o addopts= tests/test_roles.py
    expect: "passed"
  - name: forgotten, set, signed in, used once, refused, changed — the whole flow in a browser
    run: cd apps/web && npx playwright test tests/gate-password.spec.ts tests/gate.spec.ts
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
