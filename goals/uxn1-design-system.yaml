name: uxn1-design-system
goal: >
  The educator's site has one look that every subject inherits (docs/ux-rules.md, rules 9 to 11). A list is a table with
  aligned columns of fixed widths (text left, numbers right, a status centred); every table has the one FilterBar in the
  same place (dropdowns, a compact search, the filters on shown with a × each, one click to clear); a status is one chip,
  an icon and a word in green, amber or red; the top bar's Class and Subject are full-size controls and the student
  search a compact field. The Assessments page is the first moved onto them: a table of class, subject, assessment, kind,
  stage, given on, papers in and status, with its filter row. The build fails on a tag list where a table belongs, a table
  with no filter row, a status with no icon, a control in the top bar under 40 px.
# Written 2026-10-22 (night), before the code: web only, no migration, no new table. Desktop first (1440 px), per the
# night orders. Out of scope, on purpose: moving any other page (UI night 1, steps 2 and 3); the menu's order.
says:
  - words: "for teachers, in most of the places, can we use tables instead of a lot of places where the tags of subject names and all are never aligned, like on the curriculum page or on the assessments page"
    proved_by: "apps/web/tests/u51-ux-rules.spec.ts::Assessments is a table of aligned columns with the one filter row, and a status is an icon, a word and a colour"
  - words: "use icons or red, amber, green in places that make it easier for people to navigate"
    proved_by: "packages/engine/tests/test_ux_rules.py::test_a_status_chip_always_draws_its_icon_with_its_word"
  - words: "Use filters wherever possible"
    proved_by: "packages/engine/tests/test_ux_rules.py::test_a_filter_bar_has_every_part_the_pages_rely_on"
  - words: "the class and the subject buttons are too small, and then there is this massive strip for just typing the student name"
    proved_by: "apps/web/tests/u51-ux-rules.spec.ts::the top bar: Class and Subject are full-size controls, the student search is a compact field"
  - words: "Enforced by the build: a page that breaks them fails"
    proved_by: "packages/engine/tests/test_ux_rules.py::test_the_list_only_shrinks"
manual: []
scenarios: []
criteria:
  - name: the rules, the ratchet and the layout hold
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_ux_rules.py tests/test_ratchet.py -q -p no:cacheprovider -o addopts=
    expect: "passed"
  - name: the rendered rules and the pages that read Assessments
    run: cd apps/web && npx playwright test tests/u51-ux-rules.spec.ts tests/u16-assessments.spec.ts tests/u22-assessments-readable.spec.ts tests/u37-papers-grouped.spec.ts tests/u9-papers.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
