name: m0-05-people-enrolment
goal: >
  The system knows who the K2 educator is, which class she teaches, and which children are in that class, with their
  roll numbers. People, campus, academic year, class and enrolment are tables of their own: a child belongs to a class
  only through an enrolment (a move closes one row and opens another, so the history is kept); an educator holds a
  role only through a dated grant that is never deleted; the twelve roles of D-026 are rows; a class has one class
  teacher at a time, and from Grade 1 a core-subject teacher is not a class teacher (D-039, a config row): giving a
  second, or breaking that, warns and is allowed only with a reason that is recorded. Names, emails and phone numbers of staff, and a child's name and birthday, live
  only in the `pii` schema. `engine staff import` copies the staff list the website signs in from into the staff
  tables; `engine enrol k2 <csv>` loads the K2 class and its children from the school's Children List. Both show what
  they would do and write nothing until `--apply --by <name>`; both can run twice and the second run changes nothing.
# Written 2026-11-03, before the code: task M0-05 (cornerstonepune/teacher-os blueprint/roadmap.toml; scenario
# S-M0-05-people; decisions D-039, D-046, D-047, D-055). The blueprint files named in the task (data-architecture.md,
# people-and-access.md, modules.md) could not be read from the build container, so every choice that rests on them is
# listed in docs/notes/m0-05-people-enrolment.md for the orchestrator to check. Not in this slice, on purpose: who may
# see which class (P-05 says that needs a proven route first), the class list's real file (Nimish sends it on
# 2026-11-04 and it stays outside git), and any write to live. The tests use obviously placeholder rows in the test
# database only.
