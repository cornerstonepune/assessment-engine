name: md2d1-multiplication-models
goal: >
  MUL.MODELS, taught in Grade 2, shows multiplication as the models a child meets first, each a question the bank makes
  and a child answers on paper: skip counting (5, 10, 15, 20, □ is 5 × 5); an array read in three labelled boxes, how
  many rows, how many in each row, how many in all; equal jumps on a number line from 0 (4 jumps of 3 land on 12); a
  table swapped to one the level counts as known (9 × 2 = 2 × 9 = □); a cell of the multiplication square found from
  its row and its column; and stories of an array, twice as many and area in squares. Easy holds skip counting and
  arrays, Medium the jumps, Hard the swap and the square, Advance the three stories. Every question prints a box for
  each of its answers and, once taught, shows on the website's question bank as the child meets it, its answer is
  recomputed, and
  every wrong answer is a named mistake: one group fewer, one group, the numbers added, the next row of the table, and
  twice or three times as many read as two or three more.
# Written 2026-10-10, before the code: slice M2d1 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M2d1 — measured before the build"): none of MUL.MODELS' eight cases draws today.
