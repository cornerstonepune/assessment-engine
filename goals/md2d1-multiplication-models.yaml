    skill_set: MUL.MODELS
    difficulty: Easy
    n: 24
    cases: [G03, G05]
  - name: MUL.MODELS, Medium — equal jumps on a number line
    skill_set: MUL.MODELS
    difficulty: Medium
    n: 16
    cases: [G04]
  - name: MUL.MODELS, Hard — a table swapped to a known one, a cell of the square
    skill_set: MUL.MODELS
    difficulty: Hard
    n: 24
    cases: [G14, TF17]
  - name: MUL.MODELS, Advance — an array, twice as many and area, as stories
    skill_set: MUL.MODELS
    difficulty: Advance
    n: 36
