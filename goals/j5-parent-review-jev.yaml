name: j5-parent-review-jev
goal: >
  Every parent report is read sentence by sentence before an educator sees it, each question asked of the cheapest
  reader that can answer it: code first (what coins make is arithmetic, and code's); then Jev, asked of each sentence
  with only the facts it is about (the summary and a skill's line against the child's standing, a mistake's line
  against what happens in that mistake, a home activity against the facts); what Jev is sure is wrong goes back to the
  writer, what it is sure is right passes, and only what it is unsure of is read by the model (`parent_review`).
  Jev unreachable, the model reads the whole draft as before. A skill set's line is asked as a line about that skill
  set (the page prints how secure it is), and the model is given the lines as `skill_lines`, never under the draft's
  own `can_do`, which it read as a claim of being secure. Each model row says how hard its model thinks (`effort`),
  sent to that model only. Of Haiku 4.5, Sonnet 5.5 (low effort) and Opus 5.5 (low effort), the cheapest that catches
  every wrong sentence of the gold set with nothing flagged wrongly is switched on (rule 7); the eval says how many
  sentences the model had to read. What every model missed or flagged alike is code's or the gold's, never a bigger
  model's: a question the draft names is one of the child's own, and a summary that names a skill only improving says
  it has improved (Nimish's ruling, 2026-09-29, which relabelled the gold). The educator still approves every report.

# Written 2026-09-29, before the code, on Nimish's words the same day: "What do you recommend? I really want to
# integrate Jev as much as possible in all the use cases to make it efficient, cost-light, etc., so we have to do it."
# and, on the recommendation (code first, Jev on every judgement call, the model only for what Jev is unsure of, a
# person signing off): "with everything you have said (no except)". Measured before: code alone catches 4 of the gold's
# 14 wrong sentences; Jev per section, below 0.1, 7 more with none flagged wrongly (probe, 2026-09-29).
says:
  - words: "I really want to integrate Jev as much as possible in all the use cases"
    proved_by: packages/engine/tests/test_parent_review.py::test_what_jev_is_sure_is_wrong_goes_back_and_what_it_is_sure_is_right_passes
  - words: "to make it efficient, cost-light"
    proved_by: packages/engine/tests/test_parent_review.py::test_only_what_jev_is_unsure_of_is_read_by_the_model
  - words: "with everything you have said (no except)"
    proved_by: packages/engine/tests/test_parent_report.py::test_what_coins_make_is_arithmetic_and_code_holds_it
  - words: "Do you believe changing the model might help the case?"
    proved_by: packages/engine/tests/test_parent_review.py::test_the_model_reads_skill_lines_as_skill_lines_never_as_can_do
  - words: "Do you believe changing the model might help the case?"
    proved_by: packages/engine/tests/test_parent_report.py::test_a_question_the_words_name_is_the_childs_own_and_an_improving_skill_reads_as_improving
  - words: "yes, go ahead with all three"
    proved_by: packages/engine/tests/test_llm.py::test_a_rows_effort_goes_to_its_own_model_and_never_to_a_fallback
manual:
  - "On the server, after merge (the rules and the relabelled gold go live with it): Actions → engine eval → parent_review, jev_version 1, version 3 (Haiku 4.5), 4 (Sonnet 5.5, low) and 5 (Opus 5.5, low). The cheapest at every wrong sentence caught with none flagged wrongly is made active with the four Jev rows, the scores in DECISIONS-LOG.md (rule 7). First scored 2026-09-29, before the rules: 13/14 each, 8, 7 and 3 flagged wrongly (runs 36571102880, 36572682537, 36573750680)."
scenarios: []
criteria:
  - name: the sentences, the three readers in order, Jev down, the eval's counts, the coins — on the local copy
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_parent_review.py tests/test_parent_report.py tests/test_jev.py tests/test_llm.py tests/test_loaders.py -k "not expected_number and not refers_to_something" -q
    expect: "passed"
  - name: code, Jev and Haiku 4.5 on the gold set (on the server, where the model's key is)
    run: bin/engine eval parent_review --version 3 --jev-version 1
    expect: "wrong sentences caught, 0 flagged"
  - name: code, Jev and Sonnet 5.5 at low effort on the gold set (on the server)
    run: bin/engine eval parent_review --version 4 --jev-version 1
    expect: "wrong sentences caught, 0 flagged"
  - name: code, Jev and Opus 5.5 at low effort on the gold set (on the server)
    run: bin/engine eval parent_review --version 5 --jev-version 1
    expect: "wrong sentences caught, 0 flagged"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
