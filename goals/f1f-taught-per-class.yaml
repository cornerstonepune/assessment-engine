    run: cd packages/engine && uv run pytest -q tests/test_taught_per_class.py tests/test_focus_paper.py tests/test_maker.py tests/test_topics.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
