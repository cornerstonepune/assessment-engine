name: md2a-straight-multiplication
goal: >
  Multiplication is five skills, each a ladder of its own document's cases, made by the same drawer as addition and
  subtraction: the tables (MUL.FACTS); by 10, 100, 1000 and multiples of ten (MUL.TENS); 2 digits by 1 (MUL.2D1D);
  3 digits by 1 (MUL.3D1D); and 2 digits by 2 (MUL.2D2D). A question belongs to exactly one of the five, whichever
  way round it is written, and every question within their reach has a level. Every level draws questions that are,
  as measured and as their labels say in arithmetic, the cases it lists, printed the way the case says (in a line, or
  in columns with the longer number on top, a long multiplication with a row for each digit of its multiplier that
  the reader takes as working, never as the answer), with answers recomputed and no two alike. The 11 and 12 tables
  are only Advance's, in what a level holds and not only in what it draws. Every wrong answer the document names for a
  column multiplication is predicted from the question's own numbers, and one wrong answer names one mistake where two
  would be the same act. The old multiplication set's questions move onto the five and it is removed; an old paper's
  × sums count on the five. Every level fills its worksheets. Grade 1 stays exactly what its educator taught. None of
  it is taught until an educator says so.
# Written 2026-10-09, before the code: slice M2a of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M2 — measured before the build"): the case drawer (assess/draw.py) writes only + and −,
# so no × level could be its cases; × is made only by the old sampler (MUL.1D, three digit shapes) and equal groups;
# `predict("×", 68, 17)` names two mistakes, neither a long multiplication's; nothing prints the rows of a long
# multiplication. Measuring the drafted document's levels found four things it got wrong, each fixed in
# research/md_taxonomy.py and its rows: TP10 (23 × 30) and TZ07 (23 × 40) hold the same questions in two skills, so
# every round-number × that is not a table fact is MUL.TENS's and TZ01 and TZ07 join TP10 at its Advance; T03 (3 × 21)
# read the order only, so Easy held 7 × 99; the × cases read the order the numbers are written in, so 3 × 47 was in
# no case at all (A10 asks both orders: they now read the longer number and the shorter); and 19 × 14 and 68 × 17,
# the error table's own examples, were in no 2 × 2 case (T27, T28 added). Then CI (the five could not fill while MUL.1D
# held the same questions, so M2c's re-homing is in this slice; the tables' Easy sat in Grade 1, against its
# educator's list) and a second reader (ten findings: STATE.md "M2a") changed it further: long multiplication's rows
# in a layout row of their own, read as working; MUL.TENS bounded to what its labels say; Easy levels kept to their
# answers' size; TZ09 and TP11 added (251 cases); one mistake per act; the 11 and 12 tables as what a level holds.
