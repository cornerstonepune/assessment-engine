    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_mul_levels.py tests/test_mul_mistakes.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_render.py tests/test_bank.py tests/test_loaders.py tests/test_topics.py tests/test_rehome.py tests/test_every_skill.py tests/test_week_note.py tests/test_week.py tests/test_focus_paper.py tests/test_legacy.py tests/test_goal.py
    expect: "passed"
  - name: the drafted document recomputed and checked
    run: packages/engine/.venv/bin/python research/md_taxonomy.py --check
    expect: "0 faults"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
