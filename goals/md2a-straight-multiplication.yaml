manual:
  - "On live, once merged: `bin/update-live`. The five skills, their mistakes, questions and worksheets reach live
    only through `engine load`, `bank refill` and `library build`. Then approve the five on Curriculum -> Read and
    approve."
  - "Achal: the five skills' levels and grades are the drafted document's (assumption A6), except that nothing of the
    tables is Grade 1's until its educator says so. TZ01 and TZ07 moved to MUL.TENS Advance; TZ09 and TP11 are new;
    say if any of it belongs elsewhere."
  - "The week-note eval's gold names the new skills for its two multiplication notes: `bin/engine eval week_skills` on
    live, where the model is, records its score again."
