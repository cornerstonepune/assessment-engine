    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_edit_paper.py tests/test_focus_paper.py tests/test_seen.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
