# Written 2026-10-27, before the code, from Nimish's words that day. BUILD-ORDER: not a numbered slice; the class list (core/roster)
# gains the one way to change where a child is, from the child's page. Additive migration; no workflow's files change.
name: mov_move_a_child
goal: 'A coordinator, on a child''s own page, changes the child''s grade or moves them to another class, from rows and not
  from code: the grades are the grade table''s, the child keeps the same id so every answer, result and piece of evidence
  stays with them, every change is a row of an append-only history with no name in it, only a coordinator can do it (checked
  on the server), a taken roll number changes nothing and says so, what depends on the child''s grade or class is brought
  up to date by the paths that already make it, and the roster loader tells the owner before it would undo a change made here.'
says:
- words: Can you transfer <a child> to grade 4?
  proved_by: packages/engine/tests/test_child_move.py::test_a_grade_change_keeps_the_child_in_their_class_and_writes_one_history_row
- words: Can you transfer <a child> to grade 4?
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::a coordinator changes a grade after a confirm screen, and the history
    shows it
- words: Can you transfer <a child> to grade 4?
  proved_by: packages/engine/tests/test_child_move.py::test_a_move_keeps_the_same_child_id_so_every_answer_stays_with_them
- words: Can you transfer <a child> to grade 4?
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::a move to a class that works at another grade asks which grade, keeps
    the same child, and shows in the history
- words: I just wanted to confirm that we are getting this data in a structured way. It's not like some hard-coded backend.
  proved_by: packages/engine/tests/test_child_move.py::test_a_grade_is_a_row_of_the_grade_table_and_nothing_typed_is_taken
- words: I just wanted to confirm that we are getting this data in a structured way. It's not like some hard-coded backend.
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::the grades offered are the rows of the grade table, in its order
- words: I just wanted to confirm that we are getting this data in a structured way. It's not like some hard-coded backend.
  proved_by: packages/engine/tests/test_child_move.py::test_the_history_is_append_only_and_holds_no_name
- words: I just wanted to confirm that we are getting this data in a structured way. It's not like some hard-coded backend.
  proved_by: packages/engine/tests/test_child_move.py::test_the_history_table_has_row_security_and_the_web_role_reads_it_and_adds_only_through_the_function
- words: If the roll number is taken in that class, say so in words and change nothing.
  proved_by: packages/engine/tests/test_child_move.py::test_a_taken_roll_number_says_so_and_changes_nothing
- words: If the roll number is taken in that class, say so in words and change nothing.
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::a roll number that is taken is said in words and nothing changes
- words: Only a coordinator may do it. A teacher sees the section's text but no buttons. The check is on the server, not just
    hidden in the page.
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::a teacher sees the section and its history but no buttons, and a form
    posted by hand changes nothing
- words: 'It is a confirm-first screen: Move <the child> from G3 roll 7 to G4 roll 12. Their answers and results stay with
    them. Papers already printed stay as they are. With Confirm and Cancel.'
  proved_by: apps/web/tests/u70-move-a-child.spec.ts::Cancel writes nothing
- words: 'After a change, whatever is derived from the child''s grade or class is brought up to date by the existing path:
    class_band for both the old and the new class.'
  proved_by: packages/engine/tests/test_child_move.py::test_a_move_changes_the_grade_both_classes_work_at
- words: 'After a change, whatever is derived from the child''s grade or class is brought up to date by the existing path:
    the child''s prescriptions for the coming week must not include papers already printed for the old grade (do not change
    a printed paper).'
  proved_by: packages/engine/tests/test_child_move.py::test_a_move_withdraws_what_was_not_yet_made_and_leaves_every_paper_made_as_it_is
- words: After a change, whatever is derived from the child's grade or class is brought up to date by the existing path (the
    derived rings are rebuilt from the truth; do not copy numbers by hand).
  proved_by: packages/engine/tests/test_child_move.py::test_a_move_clears_the_stored_class_card_of_both_classes_and_the_card_is_rebuilt_from_the_graph
- words: 'The roster loader must not undo the change silently: make it also say when a roster file would move a child back
    to a grade that was changed here.'
  proved_by: packages/engine/tests/test_roster.py::test_a_list_that_would_undo_a_grade_changed_on_the_site_is_told_so_and_leaves_it
- words: The roster loader must not undo the change silently (a change of class through the roster makes a NEW child row,
    which strands the child's evidence).
  proved_by: packages/engine/tests/test_roster.py::test_a_list_that_still_names_the_place_a_child_moved_from_makes_no_second_child
- words: Tell me in the PR how many tables carry the child's class or grade as copied text rather than reading it from `child`.
    If any copy exists that a move would leave stale, fix it at the cause or list it plainly.
  proved_by: packages/engine/tests/test_child_move.py::test_two_tables_carry_a_childs_class_or_grade_as_text_and_both_are_a_printed_paper
- words: 'Add a test that fails if two migrations share a version number: a collision was the cause of a failed live update.'
  proved_by: packages/engine/tests/test_migration_order.py::test_no_two_migrations_share_a_version
- words: 'Add a test that fails if two migrations share a version number: a collision was the cause of a failed live update.'
  proved_by: packages/engine/tests/test_migration_order.py::test_the_check_names_two_migrations_that_share_a_version
manual:
- 'Actions → rehearse update-live (rehearse-update-live.yml), on this branch, before merge: the migration 20261220090000 runs
  on a copy of live after live''s rows arrive, and the copy comes back clean.'
- 'On the live site, the owner finds the child by name on Children, opens the child''s page and uses ''Grade and class''.
  No child was moved from this session: its name, and the live database, were not visible here (rule 6).'
- The live roster file still lists the child where they were. Until the owner updates the file, `engine week roster` leaves
  that row alone and says so ('left as changed here').
scenarios: []
criteria:
- name: the move, its history, its refusals and what depends on it
  run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_child_move.py tests/test_roster.py tests/test_migration_order.py
  expect: passed
- name: the page, the confirm screen, a taken roll, a teacher and a form posted by hand, in a browser
  run: cd apps/web && npx playwright test tests/u70-move-a-child.spec.ts
  expect: passed
- name: the website's types and lint
  run: cd apps/web && npx tsc --noEmit && npx eslint --max-warnings 0 && echo "types and lint clean"
  expect: types and lint clean
- name: the code sits where the map says; every promise has its command; lint
  run: bin/check
  expect: passed
