name: md3c-division-models
goal: >
  DIV.GROUPS, taught in Grade 2, shows division as the models a child meets first, each a question the bank makes and
  a child answers on paper. Dots are shared equally into rings (12 dots into 3 rings: 4 in each). Dots are ringed in
  equal groups (12 dots in groups of 4: 3 groups). One number is taken away again and again to 0
  (15 − 3 − 3 − 3 − 3 − 3 = 0: five 3s). An array is divided by its rows, read in three labelled boxes: in all ÷ rows =
  in each row. Jumps go back on a number line to 0 (from 20 in jumps of 4: 5 jumps). And there are stories of sharing,
  grouping, an array and "each", dividing a table to 10 read backwards. Easy holds sharing and grouping, Medium
  repeated subtraction and the array, Hard the jumps back, Advance the four stories. Every question prints a box for
  each of its answers and, once taught, shows on the website's question bank as the child meets it. Its answer is
  recomputed, and every wrong answer is a named mistake: multiplied, one group taken away, all of them counted, the
  number given written for the number asked, the start counted as a jump, and multiplying because the story says
  "each". A right answer counts for division alone, never for multiplication or addition. None of it is taught until
  an educator says so.
# Written 2026-10-10, before the code: slice M3c of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M3c — measured before the build"), each case drawn alone on a level shaped as MUL.MODELS's:
# none of DIV.GROUPS' nine cases draws. Sharing, grouping and the array divided (G15, G16, G19) and repeated
# subtraction (G17) draw nothing and say nothing: equal groups makes a × picture whatever the case asks, which the
# case then refuses, and repeated subtraction prints as a straight division, which is not its method. The jumps back
# (G18) stop on a KeyError ('hi'), not a sentence. The four stories refuse in a sentence: no ÷ template has their
# shape. Repeated subtraction was filed by the draft as a `bare_sum`, which every reader takes for "15 ÷ 3 = ___"; as
# ADR 0054 found for skip counting, it is a kind of its own. An equal-groups question uses multiplication and
# addition by its kind (`skills.by_kind`), so a sharing picture answered right would count for both: a kind's skills
# beyond its operation now depend on the operation.
