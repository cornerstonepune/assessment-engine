manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads DIV.GROUPS into a topic of its own,
    Division models, and fills its levels. No screen or paper shows it until an educator switches Division models on
    from Curriculum for Grade 2."
  - "Achal: drafted for you to correct. The pictures are dots and rings, as multiplication's are. Repeated subtraction is
    printed whole (15 − 3 − 3 − 3 − 3 − 3 = 0) and the child counts the 3s; you may want the child to write the
    subtractions. An array divided is read as in all ÷ rows = in each row. Three new mistakes, their names and what to do
    about them drafted for you: counts them all (12 dots into 3 rings, answered 12); gives the number the question gives
    for the one it asks (answered 3, the rings); counts the start as a jump (20 back to 0 in 4s, answered 6). Multiplying
    a story because it says 'each' is named on the 'each' stories (B24) and the wrong operation on the others; you may
    want it on every story that says 'each'."
scenarios:
  - name: DIV.GROUPS, Easy — dots shared into rings, dots ringed in groups
    skill_set: DIV.GROUPS
    difficulty: Easy
    n: 24
    cases: [G15, G16]
  - name: DIV.GROUPS, Medium — taken away again and again to 0, an array divided by its rows
    skill_set: DIV.GROUPS
    difficulty: Medium
    n: 24
    cases: [G17, G19]
  - name: DIV.GROUPS, Hard — jumps back on a number line to 0
    skill_set: DIV.GROUPS
    difficulty: Hard
    n: 16
    cases: [G18]
  - name: DIV.GROUPS, Advance — stories of sharing, grouping, an array and "each"
    skill_set: DIV.GROUPS
    difficulty: Advance
    n: 48
    cases: [B02, B03, B05, B24]
