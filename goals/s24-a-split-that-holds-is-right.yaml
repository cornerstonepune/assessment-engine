name: s24-a-split-that-holds-is-right
goal: >
  A box of one equation is marked by the equation, not by the one split the key prints: in "638 = 600 + [ ] + [ ]",
  19 and 19 are right, as 30 and 8 are, because 600 + 19 + 19 is 638. A paper names each such equation once, every
  box by its question and part, and code refuses one it cannot read, one that names a box not on the paper, or one the
  paper's own key does not make true. A box is right when the side it is written on comes out at the equation's total
  with what the child wrote — as a person read it, or as the engine read it once it settled the box; in
  "638 + 475 = [ ] + [ ] + [ ] = [ ]" the split and the total are two claims, so a right split beside a wrong total
  keeps the split right. A side not coming out, or not yet read, leaves each box to its own key, as before; the engine
  still settles no wrong answer on its own reading (ADR 0029), and a signed-off answer is never marked again (rule 4).
  A paper corrected in its file is live with the deploy that carries it: every deploy enters each paper again, each
  sum on the rung `bank rehome` files it on, so a paper entered again never moves a question rehome placed.

# Written 2026-09-29, on Nimish's words the same day, with the live Marking page of the Grade 3 September Week 1
# Level A paper showing question 5A and 5B, "638 = 600 + [19] + [19]", both "wrong · with working": "this question's
# right answer is 19 and 19, but its showing wrong - need to correct it". Each box was marked alone against the key's
# 30 and 8. Question 5 of G3-SEPW1-A, G3-SEPW1-B and G4-SEPW1 asks the same way: 26 boxes in eight equations.
says:
  - words: "this question's right answer is 19 and 19"
    proved_by: packages/engine/tests/test_legacy.py::test_a_box_of_an_equation_is_right_when_its_side_comes_out_at_the_total_whatever_split_the_child_chose
  - words: "but its showing wrong"
    proved_by: packages/engine/tests/test_equation.py::test_every_equation_the_school_s_papers_name_is_one_their_own_key_makes_true
  - words: "need to correct it"
    proved_by: packages/engine/tests/test_legacy.py::test_a_deploy_enters_every_paper_again_as_its_file_now_says
manual:
  - "After the merge's deploy is green: on the Marking page of each paper whose question 5 shows a right split as wrong and is not yet signed off, press Save on one box of that equation; its boxes are marked again together. An answer already signed off stays as it was signed (rule 4)."
  - "Aseem or Achal: question 5's boxes count on Addition (NUM.OPS.01, rung R27), which any split that adds up shows; the key prints the place-value split (600 + 30 + 8) the third line adds column by column. If the school wants only that split, the three papers' `holds` lines come out and each box goes back to its own key."
scenarios: []
criteria:
  - name: the equation, the papers' equations against their own keys, the marking, the deploy, rehome agreeing — on the local copy
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_equation.py tests/test_legacy.py -q
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
