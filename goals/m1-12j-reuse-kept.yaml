name: m1-12j-reuse-kept
goal: >
  A first draft the maker already wrote and was paid for, and that the judge accepts, is not paid for again: a run reads it
  from the kept reply, the checkers and the revision are asked as for any draft, and the ledger row is the one a full run
  would have written. The forecast leaves the maker out for those pages. The replay counts a word once whatever its form.
# Written 2026-11-06 (task M1-12j). W1, gate N1. The words are the orchestrator's brief of 2026-11-06 relaying the free replay
# after #430 (51 of 59 pass, no paid call). Nothing here has made a model call.
says:
  - words: "a FREE path that takes the kept replies the judge now accepts and records them as the pages' first drafts (the same ledger rows the paid run would have written)"
    proved_by: "packages/engine/tests/test_k2_draft.py::test_a_kept_first_draft_is_not_paid_for_again_the_checkers_read_it_and_the_ledger_row_is_the_same"
  - words: "the kept replies the judge now accepts"
    proved_by: "packages/engine/tests/test_k2_replay.py::test_the_first_draft_the_judge_accepts_is_kept_for_each_page_and_a_page_never_good_has_none"
  - words: "the kept replies the judge now accepts"
    proved_by: "packages/engine/tests/test_k2_replay.py::test_the_pages_still_wanted_get_the_first_draft_the_stage_already_paid_for"
  - words: "the paid stage only has to RUN THE CHECKERS (Opus plus Sonnet shadow) on them and ask the maker again for the 8 plus the other pages"
    proved_by: "packages/engine/tests/test_k2_check.py::test_kept_first_drafts_are_taken_once_and_the_pages_without_one_are_left_to_ask"
  - words: "give me the exact paid estimate ... I dispatch `forecast` too and will compare"
    proved_by: "packages/engine/tests/test_k2_draft.py::test_the_forecast_leaves_the_maker_out_for_the_pages_whose_first_draft_is_kept"
  - words: "colour/colours should be the same word"
    proved_by: "packages/engine/tests/test_k2_replay.py::test_a_word_is_counted_as_one_whatever_its_form_so_colour_and_colours_are_one_line"
manual:
  - "Not run live. After merge, `forecast` (now also prints the kept-draft figure) and then, only on the orchestrator's go and Nimish's top-up, `draft_dev_kept`: it reads the kept first drafts for free and pays only for the checkers, the revisions and the pages that have none."
criteria:
  - name: the reuse, the forecast and the run choice
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_draft.py tests/test_k2_check.py tests/test_k2_replay.py tests/test_curriculum_run_command.py tests/test_k2_forecast.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
