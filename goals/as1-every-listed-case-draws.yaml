name: as1-every-listed-case-draws
goal: >
  Every case an addition or subtraction level lists is one its own numbers can be and its kind can draw: an estimate on
  a level made of cases (R01 on ADD.2D2D, R02 on SUB.2D2D); the mistake found in numbers of the level's own two sizes
  (X03, X06, X07, X08, X09 on the 2 by 1, 3 by 1 and 3 by 2 levels); a missing number only on a level its box fits
  (M01 to M05, M24 and M25 leave the levels whose numbers can never be them); subtracting across several zeros from
  1000 and losing several digits on the 4-digit skill, whose numbers they are (SZ6, SZ9). The drawer counts only a
  draw whose numbers did not fit as unlucky, so a rule a kind cannot read fails aloud instead of drawing nothing. Every
  question is, as measured, a case of its level, its answer recomputed, every wrong answer a named mistake.
# Written 2026-10-10, before the code: slice AS1 of BUILD-ORDER "Inserted now: multiplication and division", found
# while proving M2b (STATE.md "Found while proving M2b"). Measured first (STATE.md "AS1 — measured before the build"):
# drawn alone on its level, 35 (case, level) pairs give nothing, for four causes; the stories' (W02, W03, W06) is AS2.
says:
  - words: "Everything should have something."
    proved_by: packages/engine/tests/test_every_listed_case.py::test_every_case_a_level_lists_draws_on_that_level
  - words: "look at how addition and subtraction were done"
    proved_by: packages/engine/tests/test_every_listed_case.py::test_an_estimate_on_a_level_of_cases_lets_its_case_decide_the_regrouping
  - words: "look at how addition and subtraction were done"
    proved_by: packages/engine/tests/test_every_listed_case.py::test_a_mistake_is_found_in_numbers_of_the_levels_two_sizes
  - words: "create assessments of different levels of difficulty"
    proved_by: packages/engine/tests/test_every_listed_case.py::test_a_missing_number_is_listed_only_where_its_box_fits
  - words: "create assessments of different levels of difficulty"
    proved_by: packages/engine/tests/test_every_listed_case.py::test_subtracting_from_1000_is_the_4_digit_skills
  - words: "same process"
    proved_by: packages/engine/tests/test_every_listed_case.py::test_a_rule_a_kind_cannot_read_fails_aloud
manual:
  - "On live, once merged: `bin/update-live`. The estimates, the mistakes found at the level's two sizes and SUB.4D's
    subtraction from 1000 reach the bank only through `engine load` and `bank refill`."
  - "Achal: SZ6 (1000 − 476) and SZ9 (1000 − 999) start at 1000, a 4-digit number, so they are SUB.4D's (Grade 4), not
    SUB.3D3D's (Grade 3), whose numbers are 3 digits. Say if the school teaches subtraction from 1000 in Grade 3."
scenarios:
  - name: ADD.2D2D, Advance — an estimate first, the mistake found
    skill_set: ADD.2D2D
    difficulty: Advance
    n: 40
    cases: [R01, X03, X04]
  - name: SUB.2D2D, Advance — an estimate first, the mistake found
    skill_set: SUB.2D2D
    difficulty: Advance
    n: 40
    cases: [R02, X07, X08]
  - name: ADD.2D1D, Advance — the mistake found in a 2-digit and a 1-digit number
    skill_set: ADD.2D1D
    difficulty: Advance
    n: 40
    cases: [X01, X03]
  - name: ADD.3D1D, Advance — the final carry dropped, in a 3-digit and a 1-digit number
    skill_set: ADD.3D1D
    difficulty: Advance
    n: 40
    cases: [X01, X06]
  - name: ADD.3D2D, Advance — carries left out, in a 3-digit and a 2-digit number
    skill_set: ADD.3D2D
    difficulty: Advance
    n: 40
    cases: [X01, X02, X03]
  - name: SUB.2D1D, Advance — the smaller taken from the larger, in a 2-digit and a 1-digit number
    skill_set: SUB.2D1D
    difficulty: Advance
    n: 40
    cases: [X07]
  - name: SUB.3D1D, Advance — the mistakes found in a 3-digit and a 1-digit number
    skill_set: SUB.3D1D
    difficulty: Advance
    n: 40
    cases: [X07, X08]
  - name: SUB.3D2D, Advance — the mistakes found in a 3-digit and a 2-digit number
    skill_set: SUB.3D2D
    difficulty: Advance
    n: 48
    cases: [X07, X08, X09]
  - name: SUB.4D, Hard — subtracting from 1000 across zeros, an answer that loses digits
    skill_set: SUB.4D
    difficulty: Hard
    n: 30
    cases: [SZ6, SZ9]
criteria:
  - name: every case every level lists, drawn on it; the kinds, levels, bank and taxonomy they touch
    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_every_listed_case.py tests/test_mul_advance.py tests/test_mul_levels.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_bank.py tests/test_loaders.py tests/test_every_skill.py tests/test_new_kinds.py tests/test_items.py tests/test_rehome.py tests/test_library.py tests/test_goal.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
