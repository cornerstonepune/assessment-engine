name: uxn4-papers-to-approve
goal: >
  Papers to approve (Thursday's and Friday's step) is a page on the shared blocks: one table of the class's pack (each
  child, their level and why, their paper, where it stands as a status chip; a child with no paper and a spare copy are
  rows of it too), a filter row (class, week, kind, status), the pack's approval as its one main action, and the week's
  next step under it. What it approves, who may approve and the words are unchanged. No migration.
# Written 2026-10-23 (night), before the code.
says:
  - words: "for teachers, in most of the places, can we use tables instead of a lot of places where the tags ... are never aligned"
    proved_by: "apps/web/tests/u37-papers-grouped.spec.ts::class papers to approve names each child, says why a child has no paper, and counts what it approves"
  - words: "use icons or red, amber, green in places that make it easier for people to navigate? Use filters wherever possible."
    proved_by: "apps/web/tests/u37-papers-grouped.spec.ts::papers to approve is one table with one main action and a filter row (goals/uxn4-papers-to-approve.yaml)"
  - words: "Make sure that the navigation and all the menu items are perfect"
    proved_by: "apps/web/tests/u24-no-long-lists.spec.ts::Papers to approve chooses a class's week in the filter row, however many weeks there are"
manual: []
scenarios: []
criteria:
  - name: the rules and the ratchet hold
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_ux_rules.py tests/test_ratchet.py tests/test_layout.py -q -p no:cacheprovider -o addopts=
    expect: "passed"
  - name: the pages that open Papers to approve, rendered
    run: cd apps/web && npx playwright test tests/u37-papers-grouped.spec.ts tests/u24-no-long-lists.spec.ts tests/u27-who-decides-what.spec.ts tests/u44-numbers-true.spec.ts tests/u45-papers-named.spec.ts tests/s7-paper-from-library.spec.ts tests/u51-ux-rules.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
