name: m1-05-mapping-agents
goal: >
  Where an activity of the K2 curriculum has no skill, no learning objective or no level words, an agent proposes them:
  it sees the activity's own words, the band's skills in the families people have linked to its subject, and the
  activities people mapped themselves nearest it. Code checks every proposal (every code exists in the band, a skill's
  family is one people linked to that subject, nothing named twice or already linked, level words only where the sheet
  has none) and rejects it on any problem; a second agent, another model that never sees the first one's reason, agrees
  or not. A confident, agreed, checked skill or existing objective is applied without waiting for a person; new words,
  a disagreement, a low confidence and a code-drawn audit sample go to one list a person works down. Every proposal,
  decision, apply and revert is a row of an append-only ledger, a member of staff kept by id and never by name; a machine link is marked as the machine's and can be
  reverted; every link added or removed, by anyone, is in the curriculum's edit history. Nothing is applied until the
  agents, mapping a held-out share of what people mapped blind, meet the bars set before any run.
# Written 2026-11-03 (task M1-05; design: docs/notes/m1-05-mapping-agents.md). W1, step N1. The bars
# (eval.curriculum_map.*: every skill right 0.90, people's skills found 0.85, passed on their own 0.60) were set before
# any run by the orchestrator for Nimish (D-047; he may overturn them); the dev set (100 of the 527, the rest held out
# for the final score, P-08), the audit share (10%) and the confidence bar (0.8) are rows too (map.*). The
# second instance Nimish named ("given a certain topic, the system itself generates the next set of learning
# objectives") is designed by blueprint chapter P-08 and not built here: a new kind is a prompt row, a code check and a
# bar on the same propose, check, decide, apply loop.
