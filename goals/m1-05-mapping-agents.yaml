    proved_by: "packages/engine/tests/test_map_check.py::test_no_skill_at_all_is_an_answer_and_a_person_confirms_it"
manual:
  - "The real eval, not run: no model key in the build container. On the box, after the prompts are loaded: `bin/engine eval curriculum_map --version 1` maps the 427 held-out activities of the 527 people mapped, blind, and scores it against eval.curriculum_map.*; the score goes in DECISIONS-LOG.md; only if every bar is met are the two prompt rows (curriculum_map_propose, curriculum_map_validate v1) made active. Until then `engine curriculum propose` has no active prompt and refuses."
  - "Then on the box, in this order, each a dry run first: `bin/engine curriculum propose --apply --by <staff email>`, `bin/engine curriculum review`, `bin/engine curriculum apply --apply --by <staff email>` (only the staff id is kept). Not run on live by this task."
  - "The bars (0.90, 0.85, 0.60), the audit share (10%) and the confidence bar (0.8) were set by the orchestrator under D-047; Nimish may overturn them."
  - "Actions, rehearse update-live, on this branch once the schema queue reaches it (after #363, #362, M1-02): the migration 20261230090000 runs on a copy of live; `engine past` prints the same before and after. Not dispatched by this task."
  - "Given a topic, the next learning objectives and how to teach them: designed by blueprint chapter P-08, not built here."
scenarios: []
criteria:
  - name: the code half of the validator, pure (no database, no model)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_check.py
    expect: "passed"
  - name: the eval scores a recorded run against what people mapped; the held-out share is the same every run
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_eval.py
    expect: "passed"
  - name: the ledger, a recorded run proposed, decided, applied and reverted, and the eval held to its bars (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_ledger.py
    expect: "passed"
  - name: every eval holds its score to a bar on record, the mapping agents' included
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_bars.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
