name: md4d2b2-what-a-slip-charges
goal: >
  A wrong answer counts against the operation the slip happened in, in a question of two operations as in one. A
  times-table slip while checking a division by multiplying is multiplication's; a slip in a fact family's division
  facts is division's; a mistake whose row names its skill (the bar model's part left out: word problems) is charged
  there in a two-step story too; and a story that halves ("two numbers add up to 90, one is 20 more") counts on
  Division. What is left to a choice — choosing the wrong operation in a story, an equation or a fact family — is a
  row of the table of what a mistake charges, which waits for one person's approval (A11); the equation's row covers + and
  − equations as well.
# Written 2026-10-12, before the code: M4d2b's second half (BUILD-ORDER "M4d2b2"). Measured first, on the bank as
# stored and again with the labels recomputed (STATE.md "M4d2b2 — measured before the build"): a question carrying two
# operations never read the row of the one a mistake belongs to and charged its first skill; `skills.operations` read a
# two-step story's stored copy of its operations, never its template's `divide`.
says:
  - words: "Have the mapping that you've created now and build the whole platform accordingly for multiplication."
    proved_by: "packages/engine/tests/test_md_charges.py::test_a_times_table_slip_checking_a_division_counts_against_multiplication"
  - words: "Have the mapping that you've created now and build the whole platform accordingly for multiplication."
    proved_by: "packages/engine/tests/test_md_charges.py::test_a_division_slip_in_a_fact_family_counts_against_division"
  - words: "Have the mapping that you've created now and build the whole platform accordingly for multiplication."
    proved_by: "packages/engine/tests/test_md_charges.py::test_a_story_that_halves_counts_on_division"
manual:
  - "The table of what a mistake charges (`skills.charges_by_kind`) is approved once, by Nimish or Aseem, on Curriculum → skills to approve; until then `engine audit` says it waits (A11)."
  - "`bin/update-live`'s `bank relabel` writes the new charges onto live's stored questions."
scenarios: []
criteria:
  - name: what a slip charges, and every test that pins a charge or a label
    run: cd packages/engine && uv run pytest -q tests/test_md_charges.py tests/test_mul_methods.py tests/test_div_methods.py tests/test_md_cases.py tests/test_every_skill.py tests/test_md_equality.py tests/test_estimates.py tests/test_mental.py tests/test_md_multiples.py tests/test_division_is_an_operation.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
