manual:
  - "The eval of the three prompts is not written and not run: no model key in the build container, and money is Nimish's call (D-047). Each prompt row stays inactive (rule 7) until `engine eval` scores it against a bar set before the run, on the 100 dev pages first."
  - "The upload with the lesson plan loaded as steps has not been run on the real tab or on a copy of live: `bin/engine curriculum k2 <csv>` (a dry run) prints the gaps in the sheet and in the database; the migration 20270101090000 has not run on a copy of live (rehearse update-live)."
  - "Level 0 to 3 are the sheet's columns P to S. Which of the sheet's other level sets (W to Z, AD to AI) is final is a question for the coordinator."
  - "The drafted chip on the page and the keep / change / reject buttons are screens, not built here."
scenarios: []
criteria:
  - name: the gaps counted, the steps loaded and marked the school's, the part sources, the catalogue, the ledger kinds and the prompts (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_gaps.py
    expect: "passed"
  - name: the spend cap refuses a call before it is made, counts a paid reply that failed its schema, and stops on a spend it cannot see
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_llm_budget.py tests/test_llm.py
    expect: "passed"
  - name: the run commands, forecast, ledger, apply and revert, on scripted replies (no model)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_draft.py
    expect: "passed"
  - name: the mapping eval spends from its stage, and M1-05's tests still hold
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_stage.py tests/test_map_ledger.py tests/test_map_check.py tests/test_map_eval.py
    expect: "passed"
  - name: a person keeps, changes or rejects a drafted part (the edit path behind the screens)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_review.py
    expect: "passed"
  - name: a batch of pages is judged item by item (pure, no model)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_batch.py
    expect: "passed"
  - name: the existing upload still behaves as M0-02 proved
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_upload.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
