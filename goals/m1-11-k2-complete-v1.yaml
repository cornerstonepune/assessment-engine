name: m1-11-k2-complete-v1
goal: >
  A K2 activity page has eight parts: objective, steps (what to do), thinking (how it needs to be thought about), the
  four levels (0 to 3, the sheet's own columns) and materials. Every part the school wrote is kept exactly and marked the
  school's; the sheet's lesson plan, never stored before, is loaded as the steps. The gaps are counted by code, part by
  part, in the sheet and in the database, and a name that gives different numbers from its objective is flagged to a person
  with nothing changed. A part an agent drafts later is marked drafted and a person can keep, change or reject it; the
  materials become a catalogue of items with a quantity and a unit for each activity; the drafts travel the M1-05
  ledger. The three prompts exist as rows, none active before its eval.
# Written 2026-11-04 (task M1-11, step 2 of the orchestrator's plan; design: docs/notes/m1-11-k2-complete-v1.md). W1,
# gate N1. The words below are Nimish's as the orchestrator relayed them on 4 Nov (D-071); the originals are not in this
# repository. Not built here, and not run: any model call, the eval, the agent's draft (cost approval is Nimish's, D-047).
says:
  - words: "every K2 activity page fully filled"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_each_part_of_a_page_is_counted_empty_and_a_blank_cell_of_spaces_is_empty"
  - words: "the school's own text kept exactly"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_an_upload_keeps_the_lesson_plan_as_steps_marks_it_the_schools_and_a_second_run_changes_nothing"
  - words: "the school's own text kept exactly"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_a_drafted_part_made_the_schools_by_a_later_upload_is_marked_the_schools_but_a_persons_edit_stays"
  - words: "everything drafted by an agent marked 'drafted' and editable by a person"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_a_part_has_one_source_and_it_is_the_schools_a_drafts_or_a_persons"
  - words: "flag such rows for a person and propose a correction marked drafted, never silently overwrite the school's text"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_a_name_and_an_objective_that_give_different_number_ranges_are_flagged_for_a_person"
  - words: "flag such rows for a person and propose a correction marked drafted, never silently overwrite the school's text"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_agreeing_ranges_overlapping_ranges_and_no_range_are_not_flagged"
  - words: "materials as catalogue items (item, quantity, unit)"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_materials_are_a_catalogue_and_a_line_per_activity_with_a_quantity_and_a_unit"
  - words: "REUSE that machinery; do not build a second one"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_the_proposal_ledger_takes_a_page_part_and_a_material_and_still_refuses_anything_else"
  - words: "prompts are rows per rule 2 and each gets an eval per rule 7"
    proved_by: "packages/engine/tests/test_k2_gaps.py::test_the_three_prompts_are_rows_with_a_schema_and_none_is_active_before_its_eval"
manual:
  - "The eval of the three prompts is not written and not run: no model key in the build container, and money is Nimish's call (D-047). Each prompt row stays inactive (rule 7) until `engine eval` scores it against a bar set before the run, on the 100 dev pages first."
  - "The upload with the lesson plan loaded as steps has not been run on the real tab or on a copy of live: `bin/engine curriculum k2 <csv>` (a dry run) prints the gaps in the sheet and in the database; the migration 20261231090000 has not run on a copy of live (rehearse update-live)."
  - "Level 0 to 3 are the sheet's columns P to S. Which of the sheet's other level sets (W to Z, AD to AI) is final is a question for the coordinator."
  - "The drafted chip on the page and the keep / change / reject buttons are screens, not built here."
scenarios: []
criteria:
  - name: the gaps counted, the steps loaded and marked the school's, the part sources, the catalogue, the ledger kinds and the prompts (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_gaps.py
    expect: "passed"
  - name: the existing upload still behaves as M0-02 proved
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_upload.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
