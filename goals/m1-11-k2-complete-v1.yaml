name: m1-11-k2-complete-v1
goal: >
  A K2 activity page has eight parts: objective, steps (what to do), thinking (how it needs to be thought about), the
  four levels (0 to 3, the sheet's own columns) and materials. Every part the school wrote is kept exactly and marked the
  school's; the sheet's lesson plan, never stored before, is loaded as the steps. The gaps are counted by code, part by
  part, in the sheet and in the database, and a name that gives different numbers from its objective is flagged to a person
  with nothing changed. A part an agent drafts later is marked drafted and a person can keep, change or reject it; the
  materials become a catalogue of items with a quantity and a unit for each activity; the drafts travel the M1-05
  ledger. The three prompts exist as rows, none active before its eval.
# Written 2026-11-04 (task M1-11, step 2 of the orchestrator's plan; design: docs/notes/m1-11-k2-complete-v1.md). W1,
# gate N1. The words below are Nimish's as the orchestrator relayed them on 4 Nov (D-071); the originals are not in this
# repository. Not built here, and not run: any model call, the eval, the agent's draft (cost approval is Nimish's, D-047).
