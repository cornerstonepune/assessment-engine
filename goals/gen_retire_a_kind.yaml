name: gen_retire_a_kind
goal: >
  An educator who may change a skill stops a kind of question it asks, at one level or across the whole skill, from its
  own page. Before anything changes, the page says how many questions in the bank and how many past papers the kind
  touches, and which papers are approved but not yet given. Once confirmed, no new paper draws a question of that kind
  there; every past paper and every answer already given to one keeps working and keeps its meaning (rule 4: nothing is
  deleted); an approved paper not yet given that holds one is withdrawn for approval again, and the educator is told
  which; that level's approval, and no other, is withdrawn. Each stop and each restart is a new row that supersedes the
  last, never an update, and the educator can switch the kind back on.
# Written 2026-10-26, before the code. W1, step N1 (skill sets, approved by a person) and N2 (the bank). One additive
# migration (a ledger, a view, `drawable_item` reading it), an engine module and its routes, the skill page.
