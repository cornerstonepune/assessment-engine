name: uxn2-curriculum-table
goal: >
  Curriculum is one table, a skill to a row: grade, subject, topic, skill, levels and status are columns that line up, the
  state is one chip (an icon, a word, green, amber or red), and the one filter row (grade, topic, status, a search) sits over
  it, ten rows to a page. Nothing is a tree to open and no subject is named in the blocks it uses.
# Written 2026-10-22 (night), before the code: web only, no migration, no new table. The tree the page held is gone; the
# counts it showed behind "details" are the Question bank's (/library). Versions of the curriculum come from the core track (C3).
says:
  - words: "can we use tables instead of a lot of places where the tags of subject names and all are never aligned, like on the curriculum page"
    proved_by: "apps/web/tests/u52-curriculum-table.spec.ts::Curriculum is one table of skills: grade, subject, topic, skill, levels, status"
  - words: "Use filters wherever possible"
    proved_by: "apps/web/tests/u52-curriculum-table.spec.ts::the filter row narrows the table and one click clears it"
  - words: "use icons or red, amber, green in places that make it easier for people to navigate"
    proved_by: "apps/web/tests/u52-curriculum-table.spec.ts::Curriculum is one table of skills: grade, subject, topic, skill, levels, status"
  - words: "Enforced by the build: a page that breaks them fails"
    proved_by: "packages/engine/tests/test_ux_rules.py::test_the_list_only_shrinks"
manual: []
scenarios: []
criteria:
  - name: the rules, the ratchet and the layout hold
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_ux_rules.py tests/test_ratchet.py tests/test_layout.py -q -p no:cacheprovider -o addopts=
    expect: "passed"
  - name: the rendered Curriculum
    run: cd apps/web && npx playwright test tests/u52-curriculum-table.spec.ts tests/u51-ux-rules.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
