name: s1-subject-class-and-today
goal: >
  Every screen opens under one bar: the subject, the class, and a search box. The class chosen there is the class
  every page shows (a person's own classes first, every class, or one class), and the subject chosen is kept beside it.
  The search finds a child by name or roll number, an assessment by what it tests, and a paper by its printed code, and
  opens it in one tap. Today begins with five lines, counted by code for the class and subject chosen, saying what the
  system now knows this week: papers back and answers read, what a person checked and what still waits, where the
  children stand, the mistake seen most, and who needs help on two or more skills. Under it, each person's next
  actions, as before. On a phone the menu is a row of big tabs at the foot of the screen, so the bar and the page's
  heading both sit at the top (UX7: the heading in the top 120 px, nothing off the screen, every tap target 44 px).
# Written 2026-10-22, before the code. Slice S1 of the scope Nimish locked that day (BUILD-ORDER.md, "the locked scope
# of 22 Oct"); approved to be built beside the C slices because it needs no new table. The choice of class and subject
# is a view kept in a cookie, never a permission (goals/ux9c-one-role.yaml): every class's page still opens for every
# member of staff. One subject (Maths) has rows today, so the subject list holds one entry until a second subject's
# row arrives; the five lines count by it now, through the skill's topic (skill_set → topic → subject).
says:
# Nimish, 26 Oct 2026, taking the Subject and Class boxes out of the bar ("the filter ... in the main menu at the top just needs
# to go"): two sentences asked for them at the top of every screen and are retired, with their tests (goals/nav3_what_needs_doing.yaml).
# The search box stays at the top, below.
  - words: "a search box that finds a child, an assessment or a paper code"
    proved_by: "apps/web/tests/s41-subject-class-and-today.spec.ts::the search finds a child, an assessment and a paper by its code"
  - words: "Today with the next actions and the weekly five-line note"
    proved_by: "apps/web/tests/s41-subject-class-and-today.spec.ts::Today opens on five lines of what the system knows this week, then the next actions"
  - words: "a full dashboard for educators, on a phone too"
    proved_by: "apps/web/tests/s41-subject-class-and-today.spec.ts::on a phone the bar and the heading are at the top and every tap is big enough"
manual:
  - "Once deployed: on a phone, open Today, choose your class in the page's own filter and read the five lines against what you know of the week."
scenarios: []
criteria:
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
