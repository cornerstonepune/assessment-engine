name: uxn7-check-answers
goal: >
  Check answers (Monday's second step) keeps its one main action, its next step and its one count, and gains the list a
  person looks for: what is left to check, as one table (its place in the queue, class, roll, paper, question, a status
  chip) under the answer in hand, with a filter row (class, status) and a click that opens that answer. The answer in
  hand, the words and the marking are unchanged. No migration.
# Written 2026-10-23 (night), before the code.
says:
  - words: "Use filters wherever possible."
    proved_by: "apps/web/tests/u51-ux-rules.spec.ts::Check answers lists what is left to check as one table with its filter row"
  - words: "for teachers, in most of the places, can we use tables instead of a lot of places where the tags ... are never aligned"
    proved_by: "apps/web/tests/u51-ux-rules.spec.ts::Check answers is built on the blocks: one main action, its next step, one count"
manual: []
scenarios: []
criteria:
  - name: the rules and the ratchet hold
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_ux_rules.py tests/test_ratchet.py tests/test_layout.py -q -p no:cacheprovider -o addopts=
    expect: "passed"
  - name: the check pages, rendered
    run: cd apps/web && npx playwright test tests/u51-ux-rules.spec.ts tests/u3-marking.spec.ts tests/s26-right-answer.spec.ts tests/u45-papers-named.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
