name: m1-11d-map-replay
goal: >
  A dev-set run of the mapping agents can be read back, after the fact and without a model call, from the replies
  flow_run kept: each activity's proposal against what people linked, why a proposal did not pass on its own, and the
  counts by cause. The first full run (2026-11-04, map_dev) scored 0.857 right and 0.28 passing on their own against
  bars of 0.90 and 0.60, and the replies that say why were stored with no way to read them. The proposer is
  deterministic given its replies, so asking the same questions again from the rows rebuilds every decision.
# Written 2026-11-04 (task M1-11d). W1, gate N1. The words are the orchestrator's brief of that day; the originals are
# not in this repository. Nothing here has made a model call.
says:
  - words: "from the stored flow_run replies of this run, classify every wrong skill (activity code, proposed vs gold, why) and every 'not passed on its own' (which validator disagreed and why); report counts per cause"
    proved_by: "packages/engine/tests/test_map_replay.py::test_each_proposal_is_set_against_what_people_linked_and_the_held_back_are_counted_by_cause"
  - words: "classify every wrong skill (activity code, proposed vs gold, why)"
    proved_by: "packages/engine/tests/test_map_replay.py::test_a_wrong_proposal_says_how_it_is_wrong"
  - words: "use replay to compute precision against the gold set BY confidence bucket and BY validator verdict ... whether a lower threshold, or dropping self-confidence in favour of code checks + validator agreement, keeps precision >= 0.90 while lifting auto-pass to >= 0.60"
    proved_by: "packages/engine/tests/test_map_replay.py::test_precision_is_tabled_by_confidence_and_by_verdict_and_for_each_threshold_that_could_be_set"
  - words: "do NOT run any eval (no spend)"
    proved_by: "packages/engine/tests/test_curriculum_run_command.py::test_the_forecast_makes_no_call_and_needs_nobody_to_have_run_it"
  - words: "from the stored flow_run replies of this run"
    proved_by: "packages/engine/tests/test_map_replay.py::test_a_paid_reply_kept_by_the_adapter_reads_back_as_a_stored_call"
  - words: "from the stored flow_run replies of this run"
    proved_by: "packages/engine/tests/test_map_replay.py::test_replies_come_back_in_the_order_they_were_paid_for_each_prompt_apart"
  - words: "from the stored flow_run replies of this run"
    proved_by: "packages/engine/tests/test_map_replay.py::test_a_reply_for_another_activity_or_none_left_is_not_the_same_run"
manual:
  - "Dispatch `map_replay` (a choice of the curriculum run workflow) after deploy. The replay prints the score it rebuilt: it must equal the run's own line (0.857, 0.953, 0.28); if it does not, the replies were not aligned and nothing it says is to be trusted."
  - "The run of 2026-11-04 was made before the activity code was kept on each row, so it is aligned by call order, not checked per call; runs after this change check every call."
criteria:
  - name: a stored run is read back, in order, refusals included (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_replay.py tests/test_curriculum_run_command.py tests/test_map_stage.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
