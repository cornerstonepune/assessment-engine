name: md2d2-multiplication-methods
goal: >
  MUL.2D1D, MUL.3D1D and MUL.2D2D print each calculation of their Easy, Medium and Hard levels in every written method
  the drafted document lists for the skill, in fair shares: in a line and in columns as before; partitioning, 23 × 4
  worked as 20 × 4 = □ and 3 × 4 = □, then 23 × 4 = □; a grid, 2 × 1 and 2 × 2, a box in every cell and then the
  total; expanded columns, each product written in full in a row of its own and then the total; a lattice, a box in
  every cell and then the answer; and long multiplication as before. Every step is a box with its own key, printed
  where the reader finds it and marked by itself, and every wrong step or total the bank predicts is a named mistake:
  a part multiplied with its tens taken as ones (20 × 4 written 8), a grid added up without its ones-by-ones cell, and
  steps or rows added without a carry, which is addition's mistake and counts against addition, not multiplication —
  on long multiplication too, where a question keyed before the rows' mistake had a name leaves the bank. MUL.2D1D's
  Advance holds C06, a partitioning worked with the tens taken as ones, for the child to find. Once taught, every
  method shows on the website's question bank as the child meets it. Every level fills and every scenario is 100%.
# Written 2026-10-10, before the code: slice M2d2 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M2d2 — measured before the build"): of the methods the document lists, a line, columns and
# long multiplication draw; partitioning is refused, the grid, expanded columns and the lattice draw nothing.
