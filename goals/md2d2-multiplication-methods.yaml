manual:
  - "On live, once merged: `bin/update-live` loads the corrected cases and the methods' mistakes, and `bank levels
    --apply` carries the levels' methods to MUL.2D1D, MUL.3D1D and MUL.2D2D, which wait for one approval on the Skill
    Map; the refill retires the long multiplications keyed before the rows' mistake had a name and fills every level
    in its methods."
  - "Achal: A1 (every method printed at Easy to Hard) and A11 (a slip adding the steps counts against addition) are
    the drafted assumptions this slice builds; a grade that teaches fewer methods takes them out of its level's row."
