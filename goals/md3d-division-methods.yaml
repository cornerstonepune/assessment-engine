manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads the corrected cases, and `bank levels
    --apply` carries the levels' methods to DIV.2D1D and DIV.3D1D, which wait for one approval on the Skill Map; the
    refill retires the divisions printed in the layout before their exchanges had boxes and fills every level in its
    methods."
  - "Achal: drafted for you to correct. Every written method is printed at Easy to Hard (A1): DIV.2D1D in a line,
    partitioning, chunking and short division; DIV.3D1D in a line, chunking, short division and long division. Three
    changes to the draft: a 3-digit division prints in a line too; chunking takes the lots of each place at once (96 ÷ 4:
    20 lots, then 4), since ten lots at a time would print nineteen take-aways for 588 ÷ 3; halving is MD.MENTAL's alone,
    as doubling is. A slip taking away inside a division counts against subtraction, and one multiplying against
    multiplication, as a slip adding the parts counts against addition (A11). A grade that teaches fewer methods takes
    them out of its level's row."
scenarios:
  - name: DIV.2D1D, Easy — every digit divides; in a line, partitioning, chunking, short division
    skill_set: DIV.2D1D
    difficulty: Easy
    n: 16
    cases: [D01, D02, G21, G22, G23]
  - name: DIV.2D1D, Medium — one exchange from the tens; every method
    skill_set: DIV.2D1D
    difficulty: Medium
    n: 24
    cases: [D03, D04, D02, G21, G22, G23]
  - name: DIV.2D1D, Hard — a remainder, an exchange and a zero at the end of the quotient; every method
    skill_set: DIV.2D1D
    difficulty: Hard
    n: 24
    cases: [DR04, DR05, DZ07, D02, G21, G22, G23]
  - name: DIV.3D1D, Easy — no exchange; in a line, chunking, short division, long division
    skill_set: DIV.3D1D
    difficulty: Easy
    n: 16
    cases: [D05, D15, G22, G23, G24]
  - name: DIV.3D1D, Medium — an exchange after the hundreds or the tens; every method
    skill_set: DIV.3D1D
    difficulty: Medium
    n: 24
    cases: [D06, D07, D15, G22, G23, G24]
  - name: DIV.3D1D, Hard — exchanges, zeros and remainders in the quotient; every method
    skill_set: DIV.3D1D
    difficulty: Hard
    n: 40
    cases: [D08, D09, D10, DZ01, DZ02, DZ03, DZ04, DR06, DR07, DR08, D15, G22, G23, G24]
