name: md3d-division-methods
goal: >
  DIV.2D1D (Grades 2 and 3) and DIV.3D1D (Grade 4) print each calculation of their Easy, Medium and Hard levels in
  every written method the drafted document lists for the skill, in fair shares. In a line, as before. Partitioning
  the number divided: 72 ÷ 4 worked as 40 ÷ 4 = □ and 32 ÷ 4 = □, then 72 ÷ 4 = □, a part that leaves a remainder
  with a box for it. Chunking: the lots of each place taken away, 96 ÷ 4 as 20 lots of 4 and then 4 lots, a box for
  the lots, what they take away and what is left. Short division: the division layout with each remainder exchanged
  into the next digit written small, in a box of its own. Long division: 516 ÷ 4 divided, multiplied, taken away and
  brought down, a box for every product and every number left. Every step is a box with its own key, printed where the
  reader finds it and marked by itself, and every wrong step or total the bank predicts is a named mistake: the zero
  left out of a part's quotient, one group short, a digit not brought down, an exchange's own slips, and a product's
  or a take-away's slip, which counts against multiplication or subtraction, not division. A division stored in its
  layout before its exchanges had boxes leaves the bank. Three corrections are made to the drafted document at its
  source: DIV.3D1D prints in a line too (A2), chunking takes the lots of each place (ten lots at a time would print
  nineteen take-aways for 588 ÷ 3), and halving is mental maths alone, one home, as doubling is. Once taught, every
  method shows on the website's question bank as the child meets it. Every level fills, each case in every method it
  lists, a level the bank filled before it listed them topped up in each; and every scenario is 100%.
  None of it is taught until an educator says so.
# Written 2026-10-10, before the code: slice M3d of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M3d — measured before the build"), each method case drawn alone on its skill's Hard level:
# partitioning the number divided is refused ("break_apart makes + and − questions, not ÷"); chunking, long division
# and halving draw nothing and say nothing; short division draws, but as the plain division layout, its exchanges
# neither written nor read. No level of DIV.2D1D or DIV.3D1D lists `methods`, so a division prints in a line or in
# the division layout and nothing else. The document places halving on two homes (DIV.2D1D's methods and MD.MENTAL's
# Hard) and gives DIV.3D1D no line, against its own A1 and A2; its chunking takes ten lots at a time, which a 3-digit
# division it places on DIV.3D1D cannot print.
