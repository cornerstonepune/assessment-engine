name: l8-deploy-without-downtime
goal: >
  A deploy does not take the engine down. The new engine starts beside the old one and must answer its health check
  before the old one is touched; Caddy sends every request to whichever answers, and holds a request that finds
  neither for up to 30 seconds instead of failing it. If the new engine never answers, the old one serves on and the
  deploy fails. A change to the engine's code alone rebuilds neither the browser nor the reader's models. Whenever the
  engine cannot be reached all the same, the website says "The engine is restarting. Try again in a minute." instead
  of "The engine refused (502)".
# Written 2026-10-21, before the code; Nimish: "start L8". Measured first, on the deploy engine workflow's own logs:
# every deploy from 16 to 21 Oct stopped the engine and only then started the new one, 23–31 seconds unreachable
# (10–13 of them Docker waiting to kill the old engine), after a build of 185–371 seconds that fetched Chromium and the
# reader's models again on every code change (docs/notes/l8-deploy-without-downtime.md). There is no sentence of
# Nimish's about it at first; `says` quoted the problem as the repo records it (HANDOFF.md, 2026-10-16: "the maker
# answered 'The engine refused (502)' while it did (Nimish saw it)"). Nimish, 2026-10-21, gave his own: "use that",
# on "Educators should never see an error while the system updates."
says:
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_the_new_engine_answers_beside_the_old_before_the_old_is_replaced
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_a_new_engine_that_never_answers_leaves_the_old_one_serving
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_a_new_engine_on_8000_that_never_answers_leaves_the_standby_serving
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_the_door_sends_each_request_to_whichever_engine_answers
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_a_standby_leaves_the_serving_engines_runs_alone
  - words: "Educators should never see an error while the system updates."
    proved_by: packages/engine/tests/test_deploy.py::test_a_code_change_keeps_the_browser_and_the_readers_models
  - words: "Educators should never see an error while the system updates."
    proved_by: apps/web/tests/p3-the-engine-restarting.spec.ts::a restarting engine is said in words while its door answers 502
  - words: "Educators should never see an error while the system updates."
    proved_by: apps/web/tests/p3-the-engine-restarting.spec.ts::a restarting engine is said in words while nothing answers at all
manual:
  - "The first deploy after merging: its 'start the engine' step prints 'the standby answers on 8001', then 'the engine answers on 8000 on the new code; the standby is gone'. Caddy restarts once on that deploy only (its file changed), about a second."
  - "During that deploy, the engine's public /health answers 200 every time it is asked; watch-live opens no issue."
  - "A deploy changing only engine code: 'start the engine' takes well under the 220–280 seconds it took before, its build log saying CACHED for the playwright and digits steps."
scenarios: []
criteria:
  - name: the switch, the door, the image's layers and the standby are as the tests say
    run: cd packages/engine && uv run pytest -q tests/test_deploy.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
