name: md3b3-divide-mistakes-and-stories
goal: >
  The column skills' Advance levels hold the last of what the drafted document places on them. On DIV.2D1D (Grade 3) and
  DIV.3D1D (Grade 4) a child finds the mistake in another child's division: a remainder too big (85 ÷ 4 = 20 r 5), the
  zero left out of the quotient (612 ÷ 6 = 12), the last digit never brought down (516 ÷ 4 = 12 r 3). Each worked answer
  is the named mistake made on the level's own numbers. The right answer goes in the division's own boxes, the
  quotient's and the remainder's, keyed as a straight division's are. The child says why, and a person reads it against
  the mistake's own row. On DIV.2D1D a story divides with something left over and uses it as the story needs: the full
  boxes (the remainder dropped), the rickshaws needed (one more for those left), how many are left over, or both. Each
  story's words are a template row that says what it does with the remainder, its answer is worked from its numbers and
  that row, and every wrong answer is a named mistake; the remainder not rounded up is a mistake of its own, with its own
  row. A mistake's name and what the school does about it are its row alone: no code carries a copy, nothing the code
  prints names a mistake, and Jev is shown the rows' names. Every question is, as measured, a case of its level, its
  answer recomputed, none held by two levels, and every level fills its worksheets. None of it is taught until an
  educator says so.
# Written 2026-10-10, before the code: slice M3b3 of BUILD-ORDER "Inserted now: multiplication and division", after NY1
# and NY2. Measured first (STATE.md "M3b3 — measured before the build"), on each level's own numbers: DIV.2D1D holds 331
# divisions, 254 with a remainder, and a remainder too big shows on all 254; DIV.3D1D holds 7,112, the zero left out
# showing on 1,170 and the last digit not brought down on 7,035. No step is ticked: for the last digit missed, the
# answer would always be "bring down", which a child ticking the same box every time would score, so the step is said
# in the why. Finding the mistake needs a module of its own (diagnosis.py is at 397 lines); the stories need template
# rows that say what they do with the remainder, a mistake no row holds, and a remainder's box printed after the answer.
# Names, measured: 41 names and repair hints of mistakes are written in code beside their predictors. They are read
# where a person sees them in one place only, the "why" a worked answer asks, and 2 of them say otherwise than the rows
# the school edits (M_ZERO_DROPPED, M_CARRY_ALWAYS_1); the repair hints are read only by a test; Jev's shortlist is
# shown the code's names. A division's mistakes have no name in code, so its "why" would print a code. The rows are the
# one source (rule 1): the copies go.
