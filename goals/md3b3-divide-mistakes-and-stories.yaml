manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live`. The two Advance levels' new questions and
    worksheets, the template rows and the new mistake's row reach live only through `engine load`, `bank refill` and
    `library build`."
  - "After the deploy: `engine eval mistake_guess` (the `engine eval` workflow) with Jev shown the rows' names; its score
    is recorded in DECISIONS-LOG.md."
  - "Achal: drafted for you to correct. A worked division shows one named mistake on the level's own numbers; the child
    writes the right answer in the division's boxes and says why. For the last digit not brought down, the child says
    which step went wrong in the why: no box is ticked for it. The stories' words are drafted as template rows (laddoos in
    boxes, children in rickshaws). Both asked is printed as the division writes it, 6 r 2. The remainder not rounded up
    (26 children, 4 to a rickshaw, answered 6) is a new mistake, its name and what to do about it drafted for you."
scenarios:
  - name: DIV.2D1D, Advance — the boxes, estimates and checks, the mistake found, and the stories with something left over
    skill_set: DIV.2D1D
    difficulty: Advance
    n: 40
    cases: [Q09, Q12, Q13, V09, Y10, C05, B14, B15, B16, B17]
  - name: DIV.3D1D, Advance — the boxes and estimates, the zero left out of the quotient and the last digit not brought down
    skill_set: DIV.3D1D
    difficulty: Advance
    n: 40
    cases: [Q10, V04, V10, H09, C04, C07]
