name: md3a-straight-division
goal: >
  Division is four skills, each a ladder of its own document's cases, made by the same drawer as the other three
  operations: the tables read backwards (DIV.FACTS), with a remainder under a 1-digit quotient at its Advance; by 10,
  100 and 1000 and the round numbers whose zeros leave a fact (DIV.TENS); 2 digits by 1 (DIV.2D1D); and 3 digits by 1
  (DIV.3D1D), both worked digit by digit. A division belongs to exactly one of the four, and every division within
  their reach has a level. Every level draws questions that are, as measured and as their labels say in arithmetic, the
  cases it lists, printed the way the case says (in a line, or in the division layout with the quotient above the
  number divided), with answers recomputed and no two alike. A remainder is an answer of its own, in a box of its own
  after "r", read and marked by itself. Every wrong answer the document names for a division a child works is
  predicted from the question's own numbers, each in the box it shows in. An old paper's divisions count on the four:
  144 ÷ 12 on the tables' Advance. Every level fills its worksheets. None of it is taught until an educator says so.
# Written 2026-10-10, before the code: slice M3a of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M3 — measured before the build"): none of the 85 division placements draws, since the
# drawer offers +, − and × only; offered ÷, every straight case raises "two answers, the quotient and the remainder",
# since nothing makes a question with a remainder box; no division mistake is a row; in columns a division prints as a
# column sum; July's 144 ÷ 12 waits on EQUALITY.INVERSE. The drafted levels, held to every division in reach, found
# five slips, corrected where they were drafted (research/md_rows.py): DR01 and DF16 read their examples' 2-digit
# number divided (7 ÷ 3 = 2 r 1 and 100 ÷ 11 = 9 r 1 had no level), DZ03 its example's zeros (210 ÷ 2 = 105 had none),
# and DP02 and DP03 held a remainder at Medium while ÷ 10's waits for Advance (DR10 is ÷ 10, 100 or 1000 with one now).
# ÷'s place value is measured as its own rule says: a round number divided is place value only when its zeros leave a
# fact (200 ÷ 4), so 30 ÷ 2 is an exchange from the tens. A table with a remainder is the tables' only under a 1-digit
# quotient (`from_table`): 21 ÷ 2 = 10 r 1 is short division's.
# Assumption (ADR 0056): a division that leaves a remainder has a box for it; one that leaves none is one answer, as
# the drafted document writes its answers ("21 r 1", "18").
