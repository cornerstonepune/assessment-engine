    only through `engine load`, `bank refill` and `library build`; `bank relabel` re-measures every stored division.
    Then approve the four on Curriculum -> Read and approve."
  - "Achal: the four skills' levels and grades are the drafted document's (assumption A6). Five cases are corrected
    where they were drafted (DR01, DF16, DZ03, DP02 and DP03 with DR10), and a remainder's box shows only where there
    is one (ADR 0056); say if any of it is not how the school teaches it."
