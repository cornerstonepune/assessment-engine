name: md3b1-facts-advance
goal: >
  The tables' and the tens' Advance levels, × and ÷, hold every kind the drafted document places on them, each drawn
  from its level's own numbers as a straight question is: MUL.FACTS a missing factor (first or second), the same number
  in both boxes, a fact family and a fact from a known fact; MUL.TENS the place-value factor missing and a fact scaled
  by ten; DIV.FACTS the number divided or the divisor missing, the box first, the table backwards through its fact, and
  the cost of one. Each kind makes × and ÷ as it makes + and −: a missing number has exactly one answer and names the
  mistake of reading × as + or ÷ as −, of the table one row out, or of a zero too few; the box first asks a division's
  own answer and names its mistakes; the same number in both boxes is a square; a missing place-value factor hides the
  factor, of a number to 2 digits; a fact family is the three facts its fact makes; the table backwards is answered by
  dividing and again by its fact; a fact from a known fact starts from the row above; a fact scaled by ten is worked
  from its fact, once and again; the cost of one is an exact division in its template's words. Every level holds every
  case the document places on it, or the slice that will is named. A scenario recomputes every box from its own printed
  sentence. Every question is, as measured, a case of its level, its answer recomputed, every wrong answer a named
  mistake, none held by two levels, and every level fills its worksheets. None of it is taught until an educator says
  so.
# Written 2026-10-10, before the code: slice M3b1 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M3b — measured before the build"): of the 21 ÷ kind cases none draws a question its level
# can hold, and seven × cases the document places on MUL.FACTS's and MUL.TENS's Advance (Q01, Q02, Q06, Y09, H08, Q14,
# H10) are held by no level and deferred by nothing: M2a gave those levels their straight Advance, M2b only the column
# skills their kinds. The cause is that nothing held a level to the document's placements; a test does now. The kinds
# draw their own numbers (a story's are 2 digits by 1, no table fact), which a tables level almost never holds, so each
# new kind takes its two numbers from its case, as a straight question does (`draw._pair`). Two placements no question
# can meet move to the levels their examples are, for M3b2: Y10 (a check by multiplying, no table fact) to DIV.2D1D,
# H09 (÷ 5 as ÷ 10 then doubled; 240 ÷ 5 has no fact under its zero) to DIV.3D1D. Q05 (the box first) and B07 (the
# cost of one) are exact, as Q03 and Q04 are; Q14 is of a number to 2 digits, as TP03 is; G20 is printed as its example
# is, "42 ÷ 6 = □ because 6 × □ = 42" (shape TABLE_BACKWARDS), where Y10 checks a claimed answer.
