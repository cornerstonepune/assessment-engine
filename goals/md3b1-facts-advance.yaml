manual:
  - "On live, once merged: `bin/update-live`. The three Advance levels' new cases, their questions and worksheets reach
    live only through `engine load`, `bank refill` and `library build`."
  - "Achal: each Advance holds the drafted document's cases, corrected where they could hold nothing: Y10 (a check by
    multiplying, 96 ÷ 4) moves to DIV.2D1D and H09 (÷ 5 as ÷ 10 then doubled, 240 ÷ 5) to DIV.3D1D; the box first and
    the cost of one are exact; a missing place-value factor is of a number to 2 digits. A missing factor's mistakes are
    drafted here: × read as + (8 × □ = 72 answered 64), ÷ read as − (□ ÷ 4 = 7 answered 11), the table one row out, a
    zero too few. Say if any of it is not how the school teaches it."
scenarios:
  - name: MUL.FACTS, Advance — a missing factor, the same number twice, a fact family, a fact from a known fact
    skill_set: MUL.FACTS
    difficulty: Advance
    n: 30
    cases: [Q01, Q02, Q06, Y09, H08]
  - name: MUL.TENS, Advance — the place-value factor missing, a fact scaled by ten
    skill_set: MUL.TENS
    difficulty: Advance
    n: 20
    cases: [Q14, H10]
  - name: DIV.FACTS, Advance — the number divided or the divisor missing, the box first, the table backwards, the cost of one
    skill_set: DIV.FACTS
    difficulty: Advance
    n: 30
    cases: [Q03, Q04, Q05, G20, B07]
criteria:
  - name: the three Advance levels' kinds, their mistakes and printing; the taxonomy, levels and scenarios they touch
    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_facts_advance.py tests/test_mul_levels.py tests/test_div_levels.py tests/test_mul_advance.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_render.py tests/test_bank.py tests/test_loaders.py tests/test_every_skill.py tests/test_every_listed_case.py tests/test_new_kinds.py tests/test_division_is_an_operation.py tests/test_verify.py tests/test_library.py tests/test_goal.py
    expect: "passed"
  - name: the drafted document recomputed and checked
    run: packages/engine/.venv/bin/python research/md_taxonomy.py --check
    expect: "0 faults"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
