name: md4c-multiples-and-factors
goal: >
  MD.MULTIPLES (Grades 3 and 4) asks for multiples, factors and divisibility. Easy, Grade 3: the multiples of a number up
  to a limit (the multiples of 6 up to 60), whether a number is a multiple of another (is 45 a multiple of 5?), and
  whether a number is divisible by 2, by 5 and by 10, from its last digit (340). Medium, Grade 3: all the factors of a
  number (12), its factor pairs (24), and whether a product is odd or even (6 × 7). Hard, Grade 4: the common multiples
  of two numbers below a limit (3 and 4, below 30). Advance, Grade 4: whether a number is divisible by 3, from the sum of
  its digits (117: 1 + 1 + 7 = □). A list is one answer: the child writes its numbers in any order, in groups of boxes
  with room for two more than it holds, so the count is not given away; the paper is read group by group and the list
  marked as a whole, so one factor left out is one mistake, not a row of wrong boxes. A yes-or-no is right one way as
  often as the other in every place it is asked. Every question names a mistake its wrong answer shows, twelve of them
  new and drafted for Achal: a number outside the range asked, a number that is not a multiple, a multiple left out, a
  multiple written for a factor, a number that does not divide, a factor left out, a factor pair written twice, a
  multiple of one number taken as common, a common multiple left out, the last-digit rule used for a number it does not
  work for, the first digit read for the last, and divisible by 5 taken as divisible by 10. The scenario works out
  every list, every yes-or-no and every digit sum from the question's own numbers. Every level fills and every scenario
  is 100%. None of it is taught until an educator says so.
# Written 2026-10-11, before the code: slice M4c of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M4c — measured before the build"): F01 to F07 name the kind `multiples`, which no generator
# makes; F08 draws. Four answers are lists, and the reader and marking take one number at a time: a list keyed box by
# box marks every box after one missed factor wrong. Marking already compares a key of several numbers in order, for
# what a person types (`marking._against_the_key`); a list answer today would go to a person unread.
