name: md4b2-equality
goal: >
  MD.EQUALITY (Grades 3 and 4) asks a child to complete or judge × and ÷ written as equations, each sentence printed
  with its own box or its own tick. Easy, Grade 3: a product turned round (6 × 8 = 8 × □), anything × 0 (456 × 0),
  × 1 and ÷ 1 (37 × 1 = □, 37 ÷ 1 = □), a number ÷ itself and 0 ÷ a number (9 ÷ 9 = □, 0 ÷ 9 = □), and true or false
  about turning round, a product's beside a difference's (7 × 6 = 6 × 7, 9 − 4 = 4 − 9). Medium, Grade 3: three numbers
  grouped either way ((2 × 7) × 5 = 2 × (7 × 5) = □), a fact family (4, 7, 28), a division checked by multiplying
  (96 ÷ 4 = 24? 24 × 4 = □), and a factor doubled (12 × 5 = 60, so 12 × 10 = □). Hard, Grade 4: a factor partitioned
  (7 × 12 = 7 × 10 + 7 × □), a balance against − and against ÷ (3 × 8 = 30 − □, 6 × 4 = 48 ÷ □), the missing sign
  (6 □ 3 = 18, 18 □ 3 = 6) and comparing without working (25 × 4 ○ 25 × 5, 48 ÷ 6 ○ 48 ÷ 8). Advance, Grade 4: true or
  false about ÷ 0 beside 0 ÷ a number (9 ÷ 0 = 0, 0 ÷ 9 = 0) and about a division turned round beside a product
  (12 ÷ 3 = 3 ÷ 12, 12 × 3 = 3 × 12), a remainder checked by multiplying back (85 ÷ 4 = 21 r 1? 21 × 4 + 1 = □), and a
  wrong answer explained by multiplying back (804 ÷ 4 = 21: 21 × 4 = □, and why). A true-or-false, a sign and a
  comparison are right one way as often as the other, so no tick is answered by guessing. Every question names a
  mistake its wrong answer shows: = read as "the answer comes next", every number added, × 0 kept as the number, × 1
  adding one, a number ÷ itself as 0, 0 ÷ a number as the number, the wrong sign, a comparison turned round, a division
  or a difference turned round, a claim's truth reversed, and three new, drafted for Achal: ÷ 0 read as 0, a remainder
  left out of its check, and a bigger divisor taken to give a bigger answer. Five rows say their examples' sizes
  (456 × 0, a table fact, 96 ÷ 4, 85 ÷ 4, 804 ÷ 4), so none is drawn past its grade. The scenario works out every equation from the
  sentence it prints, + and − equations and missing numbers among three numbers too, where it worked out none; and a
  comparison of two equal sums names the mistake a wrong tick shows, one changed number seen and its partner's change
  missed. Every level fills and every scenario is 100%. None of it is taught until an educator says so.
# Written 2026-10-11, before the code: slice M4b2 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M4b2 — measured before the build"): of MD.EQUALITY's 18 cases, eleven are shapes no kind
# makes, the missing sign and the comparison make + and − only, the division check refuses a remainder (DR09), the
# claim to explain is addition's only (C08), and Y04, Y09, Y10 drew past their examples' sizes. A true-or-false whose
# answer is always false (9 ÷ 0 = 0, 12 ÷ 3 = 3 ÷ 12) is answered by ticking one place; each is asked beside a true one.
# EQUALITY.INVERSE's + and − equations, drawn as scenarios on main 00a107b: the check worked out none of Medium's 24 or
# Advance's 24 answers and 12 of Hard's 24, and a comparison of two equal sums (EQ.COMPARE) named no mistake.
