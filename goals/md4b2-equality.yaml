manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads MD.EQUALITY into a topic of its own,
    Equations with × and ÷, and fills its levels. No screen or paper shows it until an educator switches it on from
    Curriculum for a grade, and its skill set waits for one approval on the Skill Map."
  - "Achal: drafted for you to correct. MD.EQUALITY is Grade 3 at Easy and Medium and Grade 4 at Hard and Advance, as
    the document drafted it; the school's objective \"Missing numbers in equations\" is at both grades. A true-or-false
    is asked beside its other, so it is not answered by guessing: a product turned round beside a difference
    (7 × 6 = 6 × 7, 9 − 4 = 4 − 9), 9 ÷ 0 = 0 beside 0 ÷ 9 = 0, a division turned round beside a product; the missing
    sign and the comparison ask a × sentence and a ÷ sentence. A wrong answer is explained by multiplying back with
    the product written (804 ÷ 4 = 21: 21 × 4 = 84), not by ticking yes or no. Three new mistakes, their names and what
    to do about them drafted for you: ÷ 0 read as 0, a remainder left out of its check (85 ÷ 4 = 21 r 1 checked as
    21 × 4 = 84), and a bigger divisor taken to give a bigger answer (48 ÷ 8 > 48 ÷ 6)."
scenarios:
  - name: MD.EQUALITY, Easy — turned round, × 0, × 1 and ÷ 1, ÷ itself and 0 ÷, true or false about turning round
    skill_set: MD.EQUALITY
    difficulty: Easy
    n: 60
    cases: [Y01, Y04, Y05, Y06, Y16]
  - name: MD.EQUALITY, Medium — grouped either way, a fact family, a division checked, a factor doubled
    skill_set: MD.EQUALITY
    difficulty: Medium
    n: 48
    cases: [Y02, Y09, Y10, Y15]
  - name: MD.EQUALITY, Hard — partitioned, balances, the missing sign, comparing without working
    skill_set: MD.EQUALITY
    difficulty: Hard
    n: 60
    cases: [Y03, Y11, Y12, Y13, Y14]
  - name: MD.EQUALITY, Advance — ÷ 0, a division turned round, a remainder checked, a wrong answer explained
    skill_set: MD.EQUALITY
    difficulty: Advance
    n: 48
    cases: [Y07, Y08, DR09, C08]
  - name: EQUALITY.INVERSE, Medium — the missing sign or signs and the balances, + and −, each worked out from its sentence
    skill_set: EQUALITY.INVERSE
    difficulty: Medium
    n: 24
  - name: EQUALITY.INVERSE, Hard — checks, true or false and comparisons, + and −, a comparison of equal sums named
    skill_set: EQUALITY.INVERSE
    difficulty: Hard
    n: 24
  - name: EQUALITY.INVERSE, Advance — the same number in both boxes and missing numbers among three, worked out
    skill_set: EQUALITY.INVERSE
    difficulty: Advance
    n: 24
