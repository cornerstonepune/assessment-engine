name: ui4b2-class-by-topic
goal: >
  Children reads topic by topic. The Children list shows every grade's children for all their topics or for one,
  chosen at the top: with a topic chosen, the skill each child most needs help on, how many are secure and how many
  practising are that topic's alone, and a sort keeps the topic. A class opens on its children against the topics it
  has answers in, each cell counting that child's skills in the topic that need help, are practising, are secure and
  have too few answers, each count in words beside its mark; a topic's name opens the class's children against that
  topic's skills alone, in that table's place, and one click returns to every topic (since 2026-10-15,
  goals/ux4-class-and-child.yaml: every skill of every topic at once said the standing twice).
# Written 2026-10-11, before the code: UI4b's second half (BUILD-ORDER "UI4b2"). Nimish, the same day: "in the Children
# tab, I think we need to now expand our thought process as more and more topics start coming in and need help. It
# should be by topic or something." Measured first (STATE.md "UI4b2 — measured before the build"): the Children list
# counts every taught topic together; a class is one grid of every skill anyone in it has answered, topic headings over
# the columns, which grows a column for every skill of every topic switched on — fifteen topics in the tree, twelve of
# them multiplication and division, not yet switched on.
# Re-pointed 2026-10-22 (goals/ux10-declutter.yaml): the Children list's topic chips were dropped; a class still reads by topic.
says:
  - words: "It should be by topic or something."
    proved_by: "apps/web/tests/u21-class-by-topic.spec.ts::a class opens on its children against its topics, and a topic opens its skills alone"
  - words: "we need to now expand our thought process as more and more topics start coming in and need help"
    proved_by: "apps/web/tests/u21-class-by-topic.spec.ts::a class opens on its children against its topics, and a topic opens its skills alone"
manual:
  - "Website only: Vercel deploys it on merge. No migration."
scenarios: []
criteria:
  - name: the Children list, a class, and every page that reads them
    run: cd apps/web && npx playwright test tests/u21-class-by-topic.spec.ts tests/u2-children.spec.ts tests/u8-children-table.spec.ts tests/u18-staff-and-search.spec.ts tests/u10-tables-read-straight.spec.ts tests/u11-colours-said.spec.ts tests/screens.spec.ts
    expect: "passed"
  - name: the website's types and lint
    run: cd apps/web && npx tsc --noEmit && npx eslint --max-warnings 0 && echo "types and lint clean"
    expect: "types and lint clean"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
