    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_photograph_page.py tests/test_boxes.py tests/test_lineup.py tests/test_copies.py tests/test_inbox.py tests/test_sorting.py tests/test_legacy.py
