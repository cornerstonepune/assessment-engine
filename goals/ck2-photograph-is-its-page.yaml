    proved_by: "apps/web/tests/u51-read-an-uploaded-file-again.spec.ts::a finished scan can be read again, and the page says why when the engine will not"
manual:
  - "After deploy, with the file kept in the engine's inbox: Read again on the 22 Oct file once (Marking, 'Read a scan'), then the engine-logs measure: copies in order and swapped, answers found of 120, answers agreeing with the person's key on the four swapped copies."
scenarios: []
