name: ck2-photograph-is-its-page
goal: >
  Which page of the paper a photograph IS comes from what it prints, never from where it sits in the file. On 2026-10-22,
  on the live check screen, "Mahishmati · question 10" (right answer 9, on the paper's second page) showed the paper's
  FIRST page. Measured on live that day (docs/notes/ck2-photograph-is-its-page.md, "Measured on live"): in the 20-page
  Grade 1 file, copies 3, 4, 7 and 8 were photographed second page first; the other six in order. Each photograph of a
  swapped copy lined up with 17 to 21 of the first page's 149 tiles of print and with 66 to 69 of the second's 72, and the
  engine had taken it for the other page. The cause: a copy with as many photographs as the paper has pages was taken as
  page 1, page 2 in file order with nothing measured (boxes._placing). Each photograph is now laid on every page of the
  paper, the way of laying them that fits best is taken if it fits clearly better than the next (a photograph that lines
  up with neither is the page the other leaves; none lining up with any keeps the file's order and goes whole to a person),
  and the answers go by that. A file sent to the engine can be read again from the site and from the engine, which
  supersedes only the readings no person has checked.
# Written 2026-10-22, before the code, from Nimish's report the same day and the live measure in the note.
says:
