    proved_by: "packages/engine/tests/test_photograph_page.py::test_two_pages_photographed_in_the_opposite_order_are_placed_by_what_they_print"
  - words: "this is happening very frequently; you really need to fix this"
    proved_by: "packages/engine/tests/test_photograph_page.py::test_the_paper_photographed_by_a_phone_is_placed_in_either_order"
  - words: "this is happening very frequently; you really need to fix this"
    proved_by: "packages/engine/tests/test_photograph_page.py::test_a_copy_photographed_second_page_first_is_read_from_the_photographs_that_are_each_page"
  - words: "this is happening very frequently; you really need to fix this"
    proved_by: "packages/engine/tests/test_copies.py::test_a_copy_photographed_second_page_first_has_each_answer_on_the_photograph_that_is_its_page"
  - words: "the picture shown is the paper's FIRST page (questions 1 to 8). Question 10 is on the paper's second page. So the picture does not contain the question"
    proved_by: "packages/engine/tests/test_copies.py::test_a_copy_photographed_second_page_first_has_each_answer_on_the_photograph_that_is_its_page"
  - words: "this is happening very frequently; you really need to fix this"
