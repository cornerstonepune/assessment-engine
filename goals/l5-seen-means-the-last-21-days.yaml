name: l5-seen-means-the-last-21-days
goal: >
  A paper the maker or a home assessment draws holds no question a child was given in the last `exposure.days` days
  (21, a threshold row), as the week's assembly already holds — and a question given longer ago may come back. When the
  bank cannot fill a line, the refusal says how many questions are left, at which skill and level, and the window it
  counted, in the school's words.
# Written 2026-10-16, before the code, from live: Neha, Grade 1's educator, asked for one Class assessment for her 13
# children — Equal groups (repeated addition), Medium, 12 questions — and was refused: "only 4 questions none of these 13
# children has been given". Medium Equal groups is four or five groups of 2 to 6, as a sum or a picture: 20 questions
# can exist, and the bank holds 16 (`min_items`). ADR 0011 let a level hold fewer than fifty questions because a 21-day
# window keeps a child from repeating one; SPEC says the same ("across weeks, exclude any item that child has seen in
# the last 21 days"). The week's assembly reads that window (`assemble._worksheets`); `focus_paper._draw`, which draws
# every maker paper and home assessment, ignored it and refused any question a child had ever been given. So a small
# level ran dry for good after a few papers. The fix is the rule's one window, read from its row, in both drawers.
says:
  - words: "Neha ma'am, the educator, is trying to create the assessment, and she is getting this error for grade 1. Just check, let me know, and solve this."
    proved_by: "packages/engine/tests/test_maker.py::test_a_question_given_before_the_window_comes_back_and_one_given_inside_it_does_not"
manual:
  - "On live, once merged and deployed: Neha makes the Grade 1 Class assessment again (Equal groups, Medium, 12, one paper for all). If the class was given so many of the level's questions in the last 21 days that fewer than 12 are left, it is still refused, and the refusal now says so; then a second line at another level fills it."
scenarios: []
criteria:
  - name: the drawers of a child's paper and the maker hold to the window
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_maker.py tests/test_focus_paper.py tests/test_paper_from_library.py
    expect: "passed"
  - name: the maker and a child's page still say what they draw
    run: cd apps/web && npx playwright test tests/m2-make-papers.spec.ts tests/m4-the-maker.spec.ts tests/u38-make-and-marking.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
