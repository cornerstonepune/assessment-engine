name: m1-06-plan-today
goal: >
  The system generates the K2 timetable from the plans, and the coordinator changes only what is wrong: for each
  fortnight it lays the school's own two-week frame (which subject sits in which period, read from the K2 planning sheet,
  never typed in) over the school's dated days, and fills each subject's periods with that subject's lines from the
  Monthly Planner, copied and never written by the system; a planner line with no period is listed, never forced into
  one; a period the school left empty stays empty for a person; and a week nobody changed regenerates identically.
# Written 2026-11-04, before the code: task M1-06 (decisions D-018, D-028, D-053, D-067; design in
# docs/notes/m1-06-k2-plan-timetable.md). Attached to W2 step N4 as files, no thirteenth step (test_layout holds the
# twelve agreed steps); the orchestrator was told. Defaults agreed with the orchestrator on 4 Nov while a person
# confirms: the current frame is `F.N - Time table 26-27`; planner Fortnights 10-17 are treated as current and flagged
# for the coordinator; Working Saturdays are left out; the K2 educator marks Fortnight 10 line by line.
# Open for a person: the Graph tab says Fortnight 10 ends 7 Dec and Fortnight 11 starts 8 Dec (a Tuesday), which
# cannot both be right; the fixtures use Mon 23 Nov to Fri 4 Dec. Holidays come from `Pre-Primary Calendar 26-27`.
# Nimish's words: the one sentence below, exactly as D-061 records it (teacher-os blueprint/decisions.md). The two lines first
# tried from the 2 Nov voice-note extract could not be matched to his recorded notes, so they are not used.
