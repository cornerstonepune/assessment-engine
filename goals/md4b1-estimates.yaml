name: md4b1-estimates
goal: >
  MD.ESTIMATE (Grade 4) asks a child to judge a product or a quotient without working it out, and then, where the
  question says so, to work it out. Easy: whether a product past the tables is odd or even (6 × 13), and the digit a
  product ends in (47 × 3 ends in □). Medium: the larger number rounded to the ten (48 × 6 ≈ 50 × 6 = □), how many
  digits a product has (67 × 75) and a quotient has (156 ÷ 4). Hard: both numbers rounded to the ten (38 × 21 ≈
  40 × 20 = □), the closest of three estimates (52 × 9 is closest to 360, 450 or 540?), and a quotient from the number
  divided rounded to the hundred (412 ÷ 8 ≈ 400 ÷ 8 = □). Advance: whether a claimed answer can be right, judged by its
  size (23 × 4 = 812) or by its remainder (47 ÷ 6 = 6 r 11). Each case is drawn on the sizes of its example, here as on
  the skill it shares (48 × 6 is 2 digits by 1 on MUL.2D1D and here alike), so nothing is past Grade 4, and the skills
  it shares draw what they drew before. Every question names a mistake a wrong answer shows: odd and even the wrong way
  round; an estimate rounded up always (52 × 9 as 60 × 9) or down always (58 × 9 as 50 × 9, a new mistake drafted for
  Achal); an answer accepted without checking its size; a right answer judged wrong; and the exact answer's slips, as
  multiplication and division name them. The closest estimate's options are what rounding to a ten gives, the right one
  first, in the middle or last as often as each. The three judging kinds name a mistake on every + and − question too,
  where the closest hundred named one in 16 draws of 100 and a right claim none. A scenario works out every answer again
  from the question as printed, an odd or even answer and a closest estimate among them. V06 and F08 are one kind of
  question, told apart by their numbers: F08 a table fact (6 × 7), V06 a product past the tables (6 × 13). Every level
  fills and every scenario is 100%. None of it is taught until an educator says so.
# Written 2026-10-11, before the code: slice M4b1 of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M4b — measured before the build"): drawn alone on a level with no shape of its own, V01,
# V02, V03 and V07 fail (`KeyError: 'digits'`) and V04, V09 and V10 draw past Grade 4 (8686 ÷ 3); each draws its
# example's sizes on its other home, from that level's shape. V05, V06 and V08 refuse ×. The closest hundred names a
# mistake on 50 of 313 draws, and a right claim judged possible names none; no scenario held those levels, and none
# works out an odd or even answer or a closest estimate.
