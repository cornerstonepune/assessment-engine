manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads MD.ESTIMATE into a topic of its own,
    Estimating products and quotients, and fills its levels. No screen or paper shows it until an educator switches it
    on from Curriculum for a grade, and its skill set waits for one approval on the Skill Map."
  - "Achal: drafted for you to correct. MD.ESTIMATE's levels are Grade 4's, as the document drafted them: no school
    objective names estimating a product, so the draft's grade stands. Each estimate is asked on its example's numbers
    (48 × 6, 67 × 75, 156 ÷ 4). The closest estimate's options are what rounding to a ten gives (52 × 9: 360, 450 or
    540), so a wrong choice shows how the child rounded: up always, or down always, a new mistake drafted for you with
    what to do about it. Odd or even of a product is asked past the tables here (6 × 13), and on a table fact in
    multiples and factors (6 × 7). A right answer judged wrong is now named on addition's and subtraction's questions
    too."
scenarios:
  - name: MD.ESTIMATE, Easy — odd or even of a product past the tables, the last digit
    skill_set: MD.ESTIMATE
    difficulty: Easy
    n: 24
    cases: [V06, V07]
  - name: MD.ESTIMATE, Medium — the larger number rounded, how many digits a product and a quotient have
    skill_set: MD.ESTIMATE
    difficulty: Medium
    n: 36
    cases: [V01, V03, V04]
  - name: MD.ESTIMATE, Hard — both numbers rounded, the closest estimate, a quotient from the hundred
    skill_set: MD.ESTIMATE
    difficulty: Hard
    n: 36
    cases: [V02, V08, V10]
  - name: MD.ESTIMATE, Advance — whether a product or a quotient can be right
    skill_set: MD.ESTIMATE
    difficulty: Advance
    n: 24
    cases: [V05, V09]
  - name: ESTIMATE.HUNDRED, Medium — the closest hundred, a mistake named on every question
    skill_set: ESTIMATE.HUNDRED
    difficulty: Medium
    n: 24
    cases: [R04]
  - name: ESTIMATE.HUNDRED, Hard — could it be right, odd or even, a mistake named on every question
    skill_set: ESTIMATE.HUNDRED
    difficulty: Hard
    n: 24
    cases: [R05, R06]
criteria:
  - name: the estimates drawn, judged, printed and named; the drawer, the rows, the judging kinds and the scenario check they touch
    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_estimates.py tests/test_reasoning.py tests/test_mul_advance.py tests/test_divide_advance.py tests/test_every_listed_case.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_new_kinds.py tests/test_every_skill.py tests/test_mistake_rows.py tests/test_items.py tests/test_verify.py tests/test_render.py tests/test_loaders.py tests/test_bank.py tests/test_library.py tests/test_each_answer.py tests/test_audit.py tests/test_division_is_an_operation.py tests/test_goal.py
    expect: "passed"
  - name: the drafted document recomputed and checked
    run: packages/engine/.venv/bin/python research/md_taxonomy.py --check
    expect: "0 faults"
  - name: the Question bank shows every estimate as the child meets it
    run: cd apps/web && npx playwright test tests/s37-estimates.spec.ts
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
