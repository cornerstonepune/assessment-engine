name: uxn5-print-and-give
goal: >
  Home assessments (the "print and give" step: each class's home papers for the week, and the class's own page of its
  children) are pages on the shared blocks. The list of classes is one table with a status chip and a filter row (class,
  grade, status), and the class papers waiting for a person are a table beside it. A class's page is one table of its
  children, what the engine proposes for each and why, where each stands (to approve, choose one, approved) and the one
  next step, with a filter row and "Approve all" as the one main action. What is approved, who may approve and the words
  are unchanged. No migration.
# Written 2026-10-23 (night), before the code. Out of scope, on purpose: /home (the "Home Assignments" page that says it
# arrives with a later workflow: BUILD-ORDER forbids building it now) and /make/custom, /make/[section]/week.
says:
  - words: "for teachers, in most of the places, can we use tables instead of a lot of places where the tags ... are never aligned"
    proved_by: "apps/web/tests/u38-make-and-marking.spec.ts::each child waiting for a home assessment is one line with one next step, the why in two lines at most"
  - words: "use icons or red, amber, green in places that make it easier for people to navigate? Use filters wherever possible."
    proved_by: "apps/web/tests/u38-make-and-marking.spec.ts::the children already approved are rows of the table, after the ones waiting, each with who approved it"
  - words: "You have to look at every screen from a teacher educator's point of view"
    proved_by: "apps/web/tests/u51-ux-rules.spec.ts::every page keeps the rules, or is named as still breaking them, and only those"
manual: []
scenarios: []
criteria:
  - name: the rules and the ratchet hold
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_ux_rules.py tests/test_ratchet.py tests/test_layout.py -q -p no:cacheprovider -o addopts=
    expect: "passed"
  - name: the pages that open home assessments, rendered
    run: cd apps/web && npx playwright test tests/u38-make-and-marking.spec.ts tests/m2-make-papers.spec.ts tests/s11-focus-paper.spec.ts tests/p4-preview-before-print.spec.ts tests/u45-papers-named.spec.ts tests/u51-ux-rules.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: every page still holds
    run: cd apps/web && npx playwright test --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
