name: t1-topics-are-operations
goal: >
  The site's topics are the operations a child learns: Addition & subtraction, Multiplication, Division, Multiples &
  factors, Number sense, and Data handling. A kind of question (estimating, a story, an equation, mental methods) is
  never a topic; the skill that asks it sits under its operation. A topic the rows no longer have is gone from the
  database after a load, so no page shows an empty topic; every word said of its skills stays on them. A class is taught
  skill by skill: switching a topic on or off for a class switches all its skills, and an educator can leave one skill
  off. A topic is taught in a class when any of its skills is. The school's switch is per skill too, for a class no one
  has spoken for. Regrouping changes no class's paper on the day: every skill keeps the word it had, whichever topic it
  now sits in. No chip on any page names a topic none of whose taught skills its classes' children can be given (a level
  of their grade or below).
# Written 2026-10-15, before the code (BUILD-ORDER "topics are operations", ADR 0076). Measured first: live's chips
# include "Number sense & strategies", "Estimation" and "Word problems", rows the seed dropped on 2026-09-23 (#44) and
# `engine load` never removed; the seed's own 16 topics hold nine slices of × and ÷; the topic is also the taught
# switch (`class_topic`, `taught_in`), and on live Multiplication is on for G2 and G3. Nimish chose six topics by
# operation and the switch per skill from the options put to him the same day.
