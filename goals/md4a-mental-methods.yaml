name: md4a-mental-methods
goal: >
  MD.MENTAL (Grades 2 to 4) asks a child to multiply and divide in the head by the method each question names, a box
  for every step and one for the answer, each step printed as the sum it works out. Easy, Grade 2, the doubling and
  halving the school's Grade 2 objective names: 14 × 4 as 14 × 2 = □ then 14 × 4 = □, double and double again; 96 ÷ 4
  as 96 ÷ 2 = □ then 96 ÷ 4 = □, halve and halve again. Medium, Grade 3: a fact scaled by ten (6 × 7 = 42, so
  60 × 7 = □), × 5 as × 10 then halved (46 × 10 = □, 46 × 5 = □), double one and halve the other (16 ÷ 2 = □,
  5 × 2 = □, 16 × 5 = □), and a fact from a known fact (7 × 8 = 56, so 7 × 9 = □). Hard, Grade 3: × 9 as ten groups
  less one (23 × 10 = □, 23 × 9 = □), × 11 as ten groups and one more (14 × 10 = □, 14 × 11 = □), × 8 as double three
  times (13 × 2 = □, 13 × 4 = □, 13 × 8 = □), and a number near a round one (19 × 6 from 20 × 6). Advance, Grade 4:
  × 25 as a hundred groups then divided by 4 (24 × 100 = □, 24 × 25 = □), and ÷ 5 as ÷ 10 then doubled (240 ÷ 10 = □,
  240 ÷ 5 = □). Every step is a box with its own key, printed where the reader finds it and marked by itself, and
  every wrong step or answer the bank predicts is a named mistake: the method's own — stopping a step short, taking
  away or adding one for a whole group, and the two compensation already names, now on a product too: putting the
  answer right the wrong way, and doubling both numbers as if that kept it — named before any other on the same wrong
  answer, and the slips of the sum each step works out, halving 74 as 32 among them (the ten exchanged lost, a row
  already). A method's own mistake counts against mental maths, a slip against the step's
  operation, and a right answer for mental maths and the operation.
  Three corrections are made to the drafted document at its source, from the school's own objectives (A6): halving
  is Grade 2's, with doubling; a fact scaled by ten is Grade 3's, as multiplying by a multiple of ten is; ÷ 5 as ÷ 10
  then doubled is Grade 4's, as dividing by 10 is; and doubling (G06) is × 2 and × 4, since × 8 by doubling is H05's
  own case. Once taught, every method shows on the website's question bank as the child meets it. Every level fills
  and every scenario is 100%. None of it is taught until an educator says so.
# Written 2026-10-11, before the code: slice M4a of BUILD-ORDER "Inserted now: multiplication and division".
# Measured first (STATE.md "M4 — measured before the build"): of MD.MENTAL's twelve cases, the seven only it holds
# (G06, G25, H02, H03, H04, H05, H06) draw nothing; the five M2b and M3b1 built draw on a level with no digit shape,
# except H10, which reads MUL.TENS's shape. The draft's grades disagree with LO-G2-0498 ("Apply doubling and halving
# strategies"), with MUL.TENS (multiples of ten from Grade 3) and with DIV.TENS (every level Grade 4).
