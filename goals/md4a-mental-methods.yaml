manual:
  - "On live, once merged: `~/cornerstone/assessment-engine/bin/update-live` loads MD.MENTAL into a topic of its own,
    Mental multiplication and division, and fills its levels. No screen or paper shows it until an educator switches
    it on from Curriculum for a grade, and its skill set waits for one approval on the Skill Map."
  - "Achal: drafted for you to correct. MD.MENTAL's levels follow the school's objectives: doubling and halving at
    Grade 2 (LO-G2-0498), the other mental methods at Grades 3 and 4 (LO-G3-0943, LO-G4-1340); a fact scaled by ten
    waits for Grade 3, where multiplying by a multiple of ten is taught, and ÷ 5 as ÷ 10 then doubled for Grade 4, where
    dividing by 10 is. Each step is printed as the sum it works out (13 × 2, 13 × 4, 13 × 8), so a child who doubles
    in their head still writes each double. Two new mistakes, their names and what to do about them drafted for you:
    stopping a step short (13 × 8 answered 52) and one for a whole group (23 × 9 as 230 − 1). Two that compensation
    already names now have a row for multiplication: putting the answer right the wrong way (the compensation sign,
    23 × 9 as 230 + 23) and doubling both numbers (16 × 5 as 32 × 10, both changed the same way). Each counts against
    mental maths, not multiplication. Halving each digit and losing the ten left over (74 ÷ 2 as 32) is the exchange
    lost, the row short division already names."
scenarios:
  - name: MD.MENTAL, Easy — doubling and halving, Grade 2
    skill_set: MD.MENTAL
    difficulty: Easy
    n: 16
    cases: [G06, G25]
  - name: MD.MENTAL, Medium — a fact scaled by ten, × 5 as × 10 then halved, double one and halve the other, a fact from a known fact
    skill_set: MD.MENTAL
    difficulty: Medium
    n: 24
    cases: [H10, H01, H04, H08]
  - name: MD.MENTAL, Hard — × 9, × 11, × 8 by doubling, a number near a round one
    skill_set: MD.MENTAL
    difficulty: Hard
    n: 24
    cases: [H02, H03, H05, H07]
  - name: MD.MENTAL, Advance — × 25 as a hundred groups divided by 4, ÷ 5 as ÷ 10 then doubled
    skill_set: MD.MENTAL
    difficulty: Advance
    n: 16
    cases: [H06, H09]
criteria:
  - name: the methods drawn, printed, read and named; the levels, drawer, marking, skills and taxonomy they touch
    run: cd packages/engine && .venv/bin/python -m pytest -q tests/test_mental.py tests/test_facts_advance.py tests/test_mul_advance.py tests/test_divide_advance.py tests/test_every_listed_case.py tests/test_md_cases.py tests/test_taxonomy.py tests/test_new_kinds.py tests/test_every_skill.py tests/test_mistake_rows.py tests/test_items.py tests/test_verify.py tests/test_render.py tests/test_loaders.py tests/test_bank.py tests/test_library.py tests/test_each_answer.py tests/test_rehome.py tests/test_goal.py
    expect: "passed"
  - name: the drafted document recomputed and checked
    run: packages/engine/.venv/bin/python research/md_taxonomy.py --check
    expect: "0 faults"
  - name: the Question bank shows every mental method, a blank for each step
    run: cd apps/web && npx playwright test tests/s36-mental-methods.spec.ts
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
