name: ux6-curriculum-for-the-educator
goal: >
  Curriculum, the question bank and the worksheets open on the person's own grade. An educator's Curriculum opens on
  the grade of their class, its topics showing and every other grade closed, and "children assessed" counts their own
  class's children only. The question bank and the worksheets open on the same grade: the questions and worksheets
  listed are that grade's, each skill's count is of that grade's levels, and every grade is one tap away. The bank's
  stock columns (each level's count, the removed questions, every grade's skills) are the coordinator's, who sees the
  whole bank as before; an educator sees one count per skill of their grade.
# Written 2026-10-21, before the code: slice UX6 of BUILD-ORDER ("Inserted now: topics are operations, and every page is
# the educator's own"); Nimish said "go" to UX6 and UX7 the same day, alongside the backend work. Measured first on a
# fresh test database (bin/testdb fresh), signed in as an educator of one Grade 2 class (STATE.md "UI audit,
# 2026-10-15" is the audit; its screenshots were in that session's scratchpad and are gone):
#   - Curriculum opened with every grade closed, and its "Children assessed" counted every child in the school;
#   - the bank listed every taught skill of every grade, with a stock table of four level columns and "removed";
#   - Worksheets read every skill of the school (`skillSets()` with no scope) and listed every worksheet, 50 a page.
# A class's grade is the database's one rule, `class_band`; grades and levels are read through lib/queries.ts, never named.
# The coordinator has every class, so no one grade is theirs: their pages open as before, every grade closed.
says:
  - words: "It should be teacher-specific."
    proved_by: "apps/web/tests/u42-curriculum-for-the-educator.spec.ts::Curriculum opens on the educator's grade, every other grade closed"
  - words: "It should be teacher-specific."
    proved_by: "apps/web/tests/u42-curriculum-for-the-educator.spec.ts::Curriculum counts the children assessed in the educator's own class"
  - words: "Most of the pages just have a long list for no reason."
    proved_by: "apps/web/tests/u42-curriculum-for-the-educator.spec.ts::the question bank opens on the educator's grade, every grade one tap away"
  - words: "They should have the right set of columns which are important."
    proved_by: "apps/web/tests/u42-curriculum-for-the-educator.spec.ts::the bank's stock columns are the coordinator's"
  - words: "Most of the pages just have a long list for no reason."
    proved_by: "apps/web/tests/u42-curriculum-for-the-educator.spec.ts::the worksheets open on the educator's grade, the counts and the list the same worksheets"
manual: []
scenarios: []
criteria:
  - name: the curriculum, bank and worksheet pages still hold
    run: cd apps/web && npx playwright test tests/u42-curriculum-for-the-educator.spec.ts tests/u5-curriculum.spec.ts tests/u12-curriculum-table.spec.ts tests/u17-curriculum.spec.ts tests/u19-whole-curriculum.spec.ts tests/u30-taught-per-class.spec.ts tests/u33-one-count.spec.ts tests/u34-grades-from-the-table.spec.ts tests/u40-taught-said-on-its-row.spec.ts tests/s3-worksheets.spec.ts tests/s5-question-bank.spec.ts tests/s2-skill-map.spec.ts tests/screens.spec.ts tests/e2e.spec.ts --reporter=line --workers=1
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
