name: p0-the-maker-makes-what-it-shows
goal: >
  The maker makes what it shows, says what it made, and stays up when the engine is slow. A paper never holds a
  question twice, however many of its lines are alike. A class is planned on one read of the bank's catalogue and
  rendered in one browser. A changed child's paper is as long as the `assemble.items_per_sheet` row says, not a number
  of the website's. A changed choice stops Make until the papers are seen again. A refused batch comes back with the
  children the educator picked. An engine that does not answer is said on the maker itself, and the same form sent
  again makes the papers once. A made paper's page says how its questions were chosen and what it works on, in the
  engine's words. The checks that would place a child are one a skill, including the skills no child of a class has
  answered. The colours are said in the rule's own numbers. A skill waiting for approval is counted once. And the
  bank's recheck names a sum it cannot recheck instead of stopping.

# Written 2026-10-01, before the code. Nimish on 2026-09-30 asked where "the weak points and the fragile points are
# still". The review's correctness pass over that day's PRs found 15 defects in the maker, the colours and the
# curriculum; P0.5 fixed one (the roll order), and this goal holds the other fourteen, and the audit crash that rows a
# website test left in the bank turned up while proving them. On 2026-10-01: "go ahead with phase 0" (P0.6).
