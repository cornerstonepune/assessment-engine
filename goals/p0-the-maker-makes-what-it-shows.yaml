scenarios: []
criteria:
  - name: the maker's papers, the recheck and the maker's route, on the local copy
    run: cd packages/engine && .venv/bin/python -m pytest tests/test_maker.py tests/test_render.py tests/test_bank.py tests/api/test_maker_routes.py -o addopts=
    expect: "passed"
  - name: the maker, the colours, the checks and the curriculum, on a production build against the local copy
    run: cd apps/web && npx playwright test tests/m4-the-maker.spec.ts tests/u11-colours-said.spec.ts tests/u12-curriculum-table.spec.ts tests/s11-focus-paper.spec.ts
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
