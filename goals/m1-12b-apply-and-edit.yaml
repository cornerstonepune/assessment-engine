name: m1-12b-apply-and-edit
goal: >
  A drafted K2 page can be put on the page without touching a word the school or a person wrote, can be read as bullets
  and slips, and can be confirmed, edited or taken back by a member of staff through the engine's routes. A re-draft
  replaces what an earlier machine draft wrote; the earlier proposal is kept in the ledger and set aside.
# Written 2026-11-05 (task M1-12b). W1, gate N1. The words are the orchestrator's brief of that day, relaying Nimish;
# the originals are not in this repository. Nothing here has made a model call and nothing has been applied live.
says:
  - words: "apply drafted text into the page parts as source=drafted, editable, revertible, every part flagged check me"
    proved_by: "packages/engine/tests/test_k2_page.py::test_applying_a_draft_writes_the_text_and_the_lists_beside_it"
  - words: "apply drafted text into the page parts as source=drafted ... every part flagged check me"
    proved_by: "packages/engine/tests/test_k2_draft.py::test_every_draft_is_written_to_its_empty_parts_marked_drafted_and_every_one_is_check_me_until_a_person_reviews"
  - words: "Where the school's own text exists, never overwrite it."
    proved_by: "packages/engine/tests/test_k2_page.py::test_a_redraft_never_writes_over_the_schools_words_or_a_persons"
  - words: "the 99 old drafts are superseded, kept in the ledger"
    proved_by: "packages/engine/tests/test_k2_page.py::test_an_older_draft_waiting_is_never_applied_over_a_newer_one_and_says_why"
  - words: "the 99 old drafts are superseded, kept in the ledger"
    proved_by: "packages/engine/tests/test_k2_page.py::test_a_newer_draft_replaces_what_an_older_draft_wrote_and_the_older_one_is_set_aside"
  - words: "revertible"
    proved_by: "packages/engine/tests/test_k2_page.py::test_reverting_a_proposal_empties_the_lists_it_wrote"
  - words: "the engine edit routes for all of it must work (edit, revert, confirm) with tests"
    proved_by: "packages/engine/tests/api/test_k2_page_routes.py::test_editing_takes_a_list_for_the_steps_and_an_idea_with_slips_for_the_thinking_or_plain_text"
  - words: "the engine edit routes for all of it must work (edit, revert, confirm) with tests"
    proved_by: "packages/engine/tests/api/test_k2_page_routes.py::test_confirming_keeps_the_words_and_makes_them_the_persons"
  - words: "the engine edit routes for all of it must work (edit, revert, confirm) with tests"
    proved_by: "packages/engine/tests/api/test_k2_page_routes.py::test_reverting_takes_the_draft_back_and_leaves_the_part_empty"
  - words: "the engine edit routes for all of it must work (edit, revert, confirm) with tests"
    proved_by: "packages/engine/tests/api/test_k2_page_routes.py::test_the_schools_words_and_a_persons_own_cannot_be_answered_and_a_bad_edit_is_refused"
  - words: "send me the exact data shape each screen reads"
    proved_by: "packages/engine/tests/api/test_k2_page_routes.py::test_reading_a_page_gives_bullets_slips_materials_and_what_the_maker_and_checker_said"
manual:
  - "Nothing has been applied live. After the dev re-draft is dispatched, `engine curriculum apply` writes the new drafts over the earlier machine drafts (the 99); the school's and people's words stay. Revert any proposal with `engine curriculum revert`."
  - "The routes are not called by any page yet: the site screens are the orchestrator's. The data shape they read is in docs/notes/m1-12b-apply-and-edit.md and the engine's /openapi.json."
criteria:
  - name: apply, lists, review and the routes
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_k2_page.py tests/test_k2_review.py tests/test_k2_draft.py tests/api/test_k2_page_routes.py tests/test_contract.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
