manual:
  - "The live call, not run: no Sarvam key in the build container. With SARVAM_API_KEY set on the server, each fixture through engine/adapters/speech.py and the parser; every template word and number counted."
  - "S-M1-01-fixtures: 8 recordings of an adult reading the spoken template with placeholder numbers, made by Nimish per research/2026-11-03-k2-voice-transcription-spike.md (no children, no real numbers); each sent to Sarvam (Nimish's choice, 3 Nov) and every template word and number counted from the parser's reading of its transcript. Fixtures are never proof (D-056)."
  - "Before the first real note: the school's Sarvam workspace Owner sets Settings, Workspace, Data retention to 'No retention' for Model APIs (Sarvam's default keeps data indefinitely), and Sarvam confirms in writing that this covers speech-to-text and that audio is not used for training."
  - "Actions, rehearse update-live, on the step 3 branch: the migration 20261226090000 runs on a copy of live; `engine past` prints the same evidence, states, scored answers, questions and levels before and after."
  - "On the engine box, the two crontab lines in docs/notes/m1-01-voice-intake.md (expire hourly, retention daily), after Nimish approves the pilot; not set up from here."
  - "The first 20 real K2 notes scored: the educator writes what each said in the expected file (voice_check.py) and `bin/engine read voice check <file>` prints the per-field agreement. Not run: no real note yet."
  - "Real-note acceptance: the first 20 real K2 notes confirmed by the educator. Not claimed by this goal."
scenarios: []
criteria:
  - name: S-M1-01-notes (typed) — the template read by code from typed transcripts, problems blocking Confirm
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_note.py
    expect: "passed"
  - name: the day a note is about, never later than the day it reached us
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_day.py
    expect: "passed"
  - name: speech to text against a recorded-response stub (the live call on fixtures is manual, not run)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_speech.py
    expect: "passed"
  - name: the tables keep every observation, never edit one, and keep a note off the website (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_tables.py
    expect: "passed"
  - name: a note from the phone to a draft, the 48-hour rule, confirm writes observations and evidence by code (a database built from the migrations)
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_intake.py tests/test_voice_confirm.py tests/test_cli_voice.py tests/api/test_voice_routes.py
    expect: "passed"
  - name: the reader scored against what was said, a typed transcript replayed, recordings kept until retention is decided
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_check.py tests/test_cli_voice.py
    expect: "passed"
  - name: a voice recording never reaches git
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_voice_intake.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
