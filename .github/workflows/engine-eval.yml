# Score a prompt on the server, where the model's key is (CLAUDE.md rule 7: a new prompt version is scored before it
# is made active). Run by hand; it reads the live rows and writes only the flow_run rows of what it spent. The purpose
# is a fixed list and every version is checked against the seed (.github/eval/command.py), so this runs `engine eval`,
# or the second reader's measure, and nothing else.
name: engine eval

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: "the prompt to score"
        type: choice
        # read_with_examples: the second reader's opinion where the box reader guessed (ADR 0091), measured with the code of
        # the branch this is run on, piped into the engine (.github/measure/second_opinion.py); the versions are ignored
        options: [parent_report, parent_review, mistake_guess, story_shape, week_skills, read_with_examples, english_generate]
      version:
        # free text: any version the seed holds, checked by .github/eval/command.py (a typed list went stale)
        description: "its version, active or not; empty: the active one (Jev's decisions score their active version)"
        type: string
        default: ""
      review_version:
        description: "parent_report only: the parent_review version that reads each draft; empty for every other"
        type: string
        default: ""
      jev_version:
        description: "parent_review only: the version of Jev's three questions that read each sentence first (0: none); empty for every other"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4  # read_with_examples only: the second reader and its measure, from this branch
      - name: a way in
        env:
          KEY: "${{ secrets.LIGHTSAIL_SSH_KEY }}"
          HOST: "${{ secrets.LIGHTSAIL_HOST }}"
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/server
          chmod 600 ~/.ssh/server
          ssh -i ~/.ssh/server -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "ubuntu@$HOST" true
      - name: the score
        env:
          HOST: "${{ secrets.LIGHTSAIL_HOST }}"
          PURPOSE: "${{ inputs.purpose }}"
          VERSION: "${{ inputs.version }}"
          REVIEW: "${{ inputs.review_version }}"
          JEV: "${{ inputs.jev_version }}"
        run: |
          S="ssh -i $HOME/.ssh/server -o ConnectTimeout=15 ubuntu@$HOST"
          if [ "$PURPOSE" = read_with_examples ]; then
            # minutes of model calls print nothing: without a keepalive the connection was dropped mid-eval (21 Oct)
            cat packages/engine/engine/w3_read/second_reader.py .github/measure/second_opinion.py |
              $S -o ServerAliveInterval=30 'sudo docker exec -i deploy-engine-1 python -'
            exit
          fi
          # each purpose gets only the options it uses, each checked against the seed (run 40469097359, 27 Oct)
          RUN=$(python3 .github/eval/command.py)
          $S -o ServerAliveInterval=30 "sudo docker exec deploy-engine-1 $RUN"
