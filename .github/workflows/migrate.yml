# The live database takes a merge's migrations before the website takes its code. Before this file, the database
# changed only when someone ran `bin/update-live`, so a page reading a new table broke on live until then (2026-09-23:
# Marking, `answer_standing`). Vercel builds every merge at once; its Deployment Checks hold the build back from the
# live address until this run says the commit's `live database` is ready (ADR 0074) — on 2026-10-15 the website
# went live at 03:00 UTC and failed every page reading a new rule until this run applied it at 03:26.
#
# Needs one repository secret, LIVE_DATABASE_URL — the same DATABASE_URL `bin/update-live` reads from
# .env (Supabase: Project Settings → Database → connection string). Without it the run says so and
# stops; nothing else is touched. `supabase db push` applies only migrations live has not recorded,
# so running it again, or `bin/update-live` after it, changes nothing.
#
# The engine server and the bank (relabel, refill, library build) still go live with `bin/update-live`.
name: migrate live
on:
  # After CI passes on a merge to main, never beside it: on a push a red merge could change the live database while
  # CI was still failing on it (code review, 2026-09-30; goals/p0-live-changes-wait-for-ci.yaml). GitHub runs this
  # file as main has it, once CI on main completes; `db push` applies only what live lacks, so a merge without a
  # migration changes nothing.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: migrate-live, cancel-in-progress: false }

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write }
    env:
      # the commit CI passed on; `github.sha` is whatever main holds when this starts, which can be a later merge
      SHA: "${{ github.event.workflow_run.head_sha || github.sha }}"
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - name: the secret is set
        env: { LIVE: "${{ secrets.LIVE_DATABASE_URL }}" }
        run: |
          if [ -z "$LIVE" ]; then
            echo "::error::LIVE_DATABASE_URL is not set; add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
      - name: this commit is main's newest
        id: plan
        env: { EVENT: "${{ github.event_name }}" }
        # Two merges close together: the older one's CI can finish last, and `db push` from a commit that lacks a
        # migration live already has refuses. Only main's newest pushes; it carries every older merge's migrations.
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$EVENT" = workflow_run ] && [ "$tip" != "$SHA" ]; then
            echo "main has moved on to ${tip::7}; its own run applies this merge's migrations with it"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.plan.outputs.go == 'yes'
        with: { version: latest }
      # 2026-10-21 12:52 UTC, school in session: `create or replace view answer_checked`, a change to the catalogue only,
      # waited 121 s for a lock live's readers of that view held, until live's 2-minute statement timeout cancelled it
      # (SQLSTATE 57014); every educator's query on that view queued behind it meanwhile. A re-run at 13:25 took 14 s.
      # So each migration gives up a lock it cannot have within 3 s (SQLSTATE 55P03; its transaction rolls back whole,
      # nothing recorded), and this step tries again shortly; any other failure stops at once. A migration that holds
      # its locks and has real work to do gets 10 minutes, not live's 2. The settings are written as the first lines of
      # each migration in this runner's checkout, so they travel inside the migration's own transaction whatever
      # connection live gives: on 2026-10-22 02:01 the first try, PGOPTIONS at connection start, reached the session
      # here but not on live (`show lock_timeout` there was not 3s). Live has already applied every file but the new
      # ones, so only those run with the lines; the repository's files are unchanged
      # (rehearsed: docs/notes/l14-migrations-wait-for-locks.md).
      - name: apply what live is missing
        if: steps.plan.outputs.go == 'yes'
        env: { LIVE: "${{ secrets.LIVE_DATABASE_URL }}" }
        run: |
          for f in supabase/migrations/*.sql; do
            { printf "set lock_timeout = '3s';\nset statement_timeout = '10min';\n"; cat "$f"; } > "$f.new"
            mv "$f.new" "$f"
          done
          for try in 1 2 3 4 5 6; do
            if out=$(supabase db push --db-url "$LIVE" --yes 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            case "$out" in *55P03*) ;; *) exit 1 ;; esac
            echo "::warning::try $try of 6: a query on live held a lock the migration needs; trying again in 20 s"
            sleep 20
          done
          echo "::error::live stayed busy for six tries; run this workflow again when it is quieter"
          exit 1
      - name: the website may go live with this commit, or may not
        if: "!cancelled() && steps.plan.outputs.go == 'yes'"
        # The status Vercel's Deployment Checks wait on, set on the commit just migrated: green once live has its
        # migrations, red when they failed, so its build is never put live. A commit main has moved on from gets none —
        # its build waits, and the newer merge's run releases the newer build, which carries this one's code.
        env:
          GH_TOKEN: "${{ github.token }}"
          STATE: "${{ job.status == 'success' && 'success' || 'failure' }}"
        run: |
          if [ "$STATE" = success ]; then said="live has this commit's migrations; the website may go live"
          else said="live's migration failed; the website stays as it was"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context="live database" \
            -f description="$said" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "live database: $STATE on ${SHA::7}"
