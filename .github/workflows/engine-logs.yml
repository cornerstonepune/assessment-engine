# What the engine on the server is doing, for whoever is working on it without a way onto the server: its last log
# lines, its processes, and the reading runs of the last day. Run by hand (Actions → engine logs → Run workflow);
# nothing is changed. 2026-09-25: a scan's reading said "running" for 25 minutes and nobody could see why.
#
# The engine logs requests and errors, never a child's name (rule 6); run logs are visible only to the repository.
name: engine logs
on:
  workflow_dispatch:
    inputs:
      lines: { description: "how many log lines", default: "300" }

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: a way in
        env:
          KEY: "${{ secrets.LIGHTSAIL_SSH_KEY }}"
          HOST: "${{ secrets.LIGHTSAIL_HOST }}"
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/server
          chmod 600 ~/.ssh/server
          ssh -i ~/.ssh/server -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "ubuntu@$HOST" true
      - name: the engine
        env:
          HOST: "${{ secrets.LIGHTSAIL_HOST }}"
          LINES: "${{ inputs.lines }}"
        run: |
          S="ssh -i $HOME/.ssh/server -o ConnectTimeout=15 ubuntu@$HOST"
          echo "== containers"; $S 'sudo docker ps --format "{{.Names}} {{.Status}}"'
          echo "== processes in the engine"; $S 'sudo docker top deploy-engine-1 -o pid,etime,pcpu,rss,args' || true
          echo "== memory"; $S 'free -m'
          # what a new dependency must fit in (ADR 0035: the digit reader's size and memory are measured before merge)
          echo "== machine"; $S 'nproc; uname -m; df -h / | tail -1; sudo docker images --format "{{.Repository}} {{.Size}}"'
          # the reader's key file, its shape only: every value masked, line ends shown as $ so a stray space shows
          echo "== ~/.aws/credentials (values masked)"
          $S "sed -E 's/=.*/= <set>/' ~/.aws/credentials | cat -A" || true
          echo "== reading runs, last day"
          cat > runs.py <<'PY'
          from engine.core import db
          with db.connect() as c:
              for r in c.execute("select id, status, started_at, finished_at, left(coalesce(error, ''), 300) as error"
                                 " from flow_run where flow = 'read-scan' and started_at > now() - interval '1 day'"
                                 " order by started_at"):
                  print(r["id"], r["status"], r["started_at"], r["finished_at"], r["error"])
          PY
          $S 'sudo docker exec -i deploy-engine-1 python -' < runs.py || true
          echo "== log"; $S "sudo docker logs --tail ${LINES:-300} deploy-engine-1 2>&1"
