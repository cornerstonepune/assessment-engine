# Managed by the Athena harness: reinstalling overwrites this file.
# Nightly health check of the harness in this repository. No AI model and no secrets beyond GITHUB_TOKEN.
# Failures open or update one issue titled "Athena health: <date>"; a clean night closes it.
name: athena-health
on:
  schedule:
    - cron: "47 21 * * *"   # 03:17 IST
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: athena health
        env:
          ATHENA_HEALTH_CI: "1"
        run: python3 .claude/athena/bin/athena health || [ $? -eq 1 ]   # 1 means checks failed; anything else is a crash
      - name: CI time of the last merged pull requests, by tier
        continue-on-error: true   # a GitHub hiccup must never silence the health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .claude/athena/bin/athena pr-times "$RUNNER_TEMP/pr-times.json" && echo "ATHENA_PR_TIMES=$RUNNER_TEMP/pr-times.json" >> "$GITHUB_ENV"
      - name: athena scorecard
        env:
          ATHENA_HEALTH_CI: "1"
        run: python3 .claude/athena/bin/athena scorecard
      - name: Keep the Athena health issue in step
        env:
          ATHENA_HEALTH_CI: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .claude/athena/bin/health_issue.py
