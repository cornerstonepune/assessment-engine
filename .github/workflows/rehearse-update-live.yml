# `bin/update-live`'s data steps rehearsed on a copy of live, before a person runs them on live.
#
# The copy is built in this runner from the repository's migrations, then filled with every live row
# (pg_dump, read only), and each count is compared with live's in the very snapshot the dump was taken
# from (`engine live copy`). The whole sequence runs on the copy and its checks must come back clean
# (`engine live data`), then every child's home paper is listed as Make papers would propose it.
# Live itself is only read: `bin/update-live`, run by a person, changes it. The copy dies
# with the runner; nothing is kept.
# Children's names are in the rows (`pii`) but nothing here prints one: the commands print codes, counts,
# sections and roll numbers.
#
# Needs the repository secret LIVE_DATABASE_URL (the one `migrate live` uses).
name: rehearse update-live
on: workflow_dispatch

concurrency: { group: rehearse-update-live, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LIVE: "${{ secrets.LIVE_DATABASE_URL }}"
      COPY: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: the engine
        working-directory: packages/engine
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
      # The copy's Postgres 17, and a client as new as live, from the PostgreSQL apt repository: no container image,
      # whose anonymous pull two registries have refused (bin/ci-postgres)
      - name: the copy's database
        run: bin/ci-postgres
      - name: live answers, read only
        run: |
          if [ -z "$LIVE" ]; then echo "::error::LIVE_DATABASE_URL is not set"; exit 1; fi
          psql "$LIVE" -tAc "set default_transaction_read_only = on; select 'live ' || version()"
      - name: the copy's schema, from the migrations
        run: |
          psql "$COPY" -q -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
          # Live as it is: the migrations live has applied, then the tables someone made there by hand (rule 9 —
          # `item_placement` stopped rehome on 2026-09-24 and a copy without it did not). The migrations
          # `bin/update-live` pushes run once live's rows are in, below.
          applied=$(psql "$LIVE" -tAc "select version from supabase_migrations.schema_migrations")
          for f in supabase/migrations/*.sql; do v=$(basename "$f" | cut -d_ -f1); if echo "$applied" | grep -qx "$v"; then psql "$COPY" -q -v ON_ERROR_STOP=1 -f "$f" >/dev/null; fi; done
          tables="select schemaname || '.' || tablename from pg_tables where schemaname in ('public', 'pii') order by 1"
          for t in $(LC_ALL=C comm -13 <(psql "$COPY" -tAc "$tables" | LC_ALL=C sort) <(psql "$LIVE" -tAc "$tables" | LC_ALL=C sort)); do
            echo "::warning::on live but made by no migration (rule 9), copied as live has it: $t"
            pg_dump "$LIVE" --schema-only --no-owner --no-privileges --table="$t" | psql "$COPY" -q -v ON_ERROR_STOP=1 >/dev/null
          done
          psql "$COPY" -q -v ON_ERROR_STOP=1 -c "create schema supabase_migrations; create table supabase_migrations.schema_migrations (version text primary key);"
          psql "$LIVE" -tAc "select version from supabase_migrations.schema_migrations" | psql "$COPY" -q -v ON_ERROR_STOP=1 -c "copy supabase_migrations.schema_migrations from stdin"
      - name: the copy's rows, every one of live's
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: |
          tables="select schemaname || '.' || tablename from pg_tables where schemaname in ('public', 'pii') order by 1"
          psql "$COPY" -tAc "$tables" | LC_ALL=C sort > /tmp/copy.tables
          psql "$LIVE" -tAc "$tables" | LC_ALL=C sort > /tmp/live.tables
          extra=$(LC_ALL=C comm -13 /tmp/copy.tables /tmp/live.tables)
          if [ -n "$extra" ]; then echo "::error::on live and not on the copy: $(echo $extra)"; exit 1; fi
          # live's counts are read in the snapshot pg_dump dumps, so papers made meanwhile cannot part them (engine/checks/live_copy.py)
          bin/engine live copy
      # Every grade live's rows hold, before the migrations make each a key into `grade` (ADR 0085): a grade no row of
      # `grade` holds stops the migration below, and this says which. Codes and counts only.
      - name: the grades live's rows hold
        run: |
          psql "$LIVE" -tAc "select 'live: grade table ' || coalesce(to_regclass('public.grade')::text, 'absent') || ', last migrations ' || string_agg(version, ' ' order by version desc) from (select version from supabase_migrations.schema_migrations order by version desc limit 4) v"
          psql "$COPY" -tAc "select 'copy: grade table ' || coalesce(to_regclass('public.grade')::text, 'absent')"
          psql "$COPY" -c "select 'rung' as held_by, band as grade, count(*) from rung group by 2
            union all select 'child', band, count(*) from child group by 2
            union all select 'sheet_template', band, count(*) from sheet_template group by 2
            union all select 'blueprint', band, count(*) from blueprint group by 2
            union all select 'level_rule', band, count(*) from level_rule group by 2
            union all select 'registry', band, count(*) from (select band from milestone union all select band from learning_objective union all select band from activity union all select band from report_item union all select band from trait) r group by 2
            union all select 'level_band', e.value, count(*) from skill_set s, jsonb_each_text(s.level_band) e group by 2
            order by 1, 2"
      # The migrations `bin/update-live` pushes, run on live's rows as they will be on live. Until 2026-10-20 they ran on
      # the empty copy before its rows arrived, and the rows were restored with their triggers off, so a new key (ADR
      # 0084) was never checked against a live row. Each recorded as `supabase db push` records it, so the copy's own
      # check afterwards finds it applied (2026-09-30: a branch's new migration was on the copy, unrecorded, and
      # "every migration is applied" failed).
      - name: the migrations live has not applied, on live's rows
        run: |
          applied=$(psql "$LIVE" -tAc "select version from supabase_migrations.schema_migrations")
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            if ! echo "$applied" | grep -qx "$v"; then
              echo "applying ${f##*/}"
              psql "$COPY" -q -v ON_ERROR_STOP=1 -f "$f" >/dev/null
              psql "$COPY" -q -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations (version) values ('$v')"
            fi
          done
      - name: before, on the copy
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: bin/engine live data --url "$COPY" || true
      - name: stories the labeller cannot name (their text; questions hold no names)
        run: |
          psql "$COPY" -c "select item_key, skill_set_code, stem, spec from item where fmt = 'word_1step' and not (tags ? 'structure') order by item_key limit 25"
      - name: "SF2 measured: what approval per skill x kind would take off papers, live as it is"
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: cd packages/engine && uv run python ../../.github/measure/sf2_kinds.py
      - name: "SF2 measured: what a format is, and what each starting rule would take off papers"
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: cd packages/engine && uv run python ../../.github/measure/sf2_formats.py
      - name: rehearse on the copy — bin/update-live steps 4-6
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: |
          bin/engine load
          bin/engine bank levels --apply
          for p in supabase/seed/papers/*.json; do bin/engine legacy paper "$p" >/dev/null; done
          bin/engine legacy mark-again --by "the marking rule (rehearsal)"  # as every deploy does, naming each change
          bin/engine bank rekey
          bin/engine bank relabel
          bin/engine bank rehome
          bin/engine bank refill
          bin/engine library build
          bin/engine graph
          bin/engine library check
          bin/engine bank taxonomy
          bin/engine asks  # what each person answered on live's site, read here by whoever builds next
      - name: "SF2 measured: the same, after update-live"
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: cd packages/engine && uv run python ../../.github/measure/sf2_kinds.py && uv run python ../../.github/measure/sf2_formats.py
      - name: answers still on a rung no skill holds (their questions; no names)
        if: always()
        run: |
          psql "$COPY" -c "select e.placed_rung, i.item_key, i.source, i.fmt, left(coalesce(i.spec ->> 'question', i.stem, i.spec::text), 90) as question, count(*) as answers from evidence_placed e left join item_result r on r.id = e.item_result_id left join item i on i.id = r.item_id where e.confirmed_by is not null and not exists (select 1 from skill_set ss where ss.tenant_id = e.tenant_id and ss.rung_code = e.placed_rung) group by 1, 2, 3, 4, 5 order by 1, 2"
      - name: levels short of their target, what they retired and why; rungs no skill holds (codes and numbers, no names)
        if: always()
        run: |
          psql "$COPY" -c "with short as (select s.code, d.key as level, (d.value ->> 'min_items')::int as target, (select count(*) from item i where i.status = 'active' and i.skill_set_code = s.code and i.difficulty = d.key) as n from skill_set s, jsonb_each(s.difficulty) d where d.value ? 'min_items') select sh.code, sh.level, sh.n, sh.target, i.item_key, i.status, i.source, i.generator, i.created_at::date as made, i.updated_at::date as changed, left(coalesce(i.stem, i.spec::text), 50) as question, f.actor, left(f.note, 110) as why from short sh join item i on i.skill_set_code = sh.code and i.difficulty = sh.level and i.status <> 'active' left join item_feedback f on f.item_id = i.id where sh.n < sh.target order by 1, 2, 5"
          psql "$COPY" -c "select r.code, r.band, (select count(*) from item i where i.rung_code = r.code) as questions, (select count(*) from item i where i.rung_code = r.code and i.status = 'active') as active, (select count(*) from evidence_placed e where e.placed_rung = r.code) as answers from rung r where not exists (select 1 from skill_set s where s.rung_code = r.code)"
          psql "$COPY" -c "select i.rung_code, i.item_key, i.status, i.source, i.skill_set_code, i.difficulty, i.generator, i.created_at::date as made, left(coalesce(i.stem, i.spec::text), 60) as question from item i where not exists (select 1 from skill_set s where s.rung_code = i.rung_code) order by 1, 2"
      - name: the copy after — must be clean
        env: { DATABASE_URL: "${{ env.COPY }}" }
        run: |
          # the audit `bin/update-live` prints, so what it will say on live is read here first (2026-10-12: 33 stories
          # retired by a relabel were first seen in Nimish's terminal)
          bin/engine audit || true
          bin/engine live data --url "$COPY"
          bin/engine live homes --url "$COPY"
