# What must hold before anything reaches main. The style is machine-enforced here (ruff format
# --check) so it cannot drift back into hand formatting. The engine suite runs against a database built
# from this repository alone (`bin/testdb fresh`: every migration, the seed, the question bank and the
# worksheet library), so a test that reads the database runs here instead of skipping itself.
# Deployment: Vercel deploys main on every merge. Once this passes on main, migrate.yml applies the merge's
# migrations to the live database and deploy-engine.yml rebuilds the engine server; neither starts beside it.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/engine } }
    services:
      postgres:
        # Docker Hub's official image from AWS's copy of it: Docker Hub refuses anonymous pulls past a
        # limit per address, and runners share addresses (2026-10-09: every job died before its first step, twice)
        image: public.ecr.aws/docker/library/postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # the tests refuse any database that is not on this machine (conftest.py, core/db.py)
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      # the whole history, for the ratchet below to read the baselines of the commit this change starts from
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      # The server builds with `uv sync --frozen`, which installs the lockfile and nothing else. A
      # lock missing boto3 passed every check here (a fresh resolve found it) and the deployed
      # engine could not start. The lock must match pyproject.toml, or the build is refused.
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv run ruff format --check engine tests
      - run: uv run ruff check engine tests
      # Today's debt is frozen in workflows.json and pyproject.toml (files over 400 lines, functions past the
      # complexity limits, the coverage floor); a change may tighten each number and never loosen it
      # (goals/p1-the-gates-hold.yaml). The base is the pull request's, or the commit main was at before a push.
      - run: uv run engine ratchet --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      # A paper is printed through Chromium (assess/render.py); the test that scans printed papers needs it.
      - run: uv run playwright install --with-deps chromium
      # The digit reader's models (ADR 0035, ~135 MB): test_digits and test_boxes run the real reader.
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-${{ hashFiles('packages/engine/uv.lock') }}
      # The spine's provenance check (goals/spine-traceable.yaml) reads NCERT's own PDFs (~69 MB), fetched from
      # ncert.nic.in and refused unless each matches the fingerprint recorded when the import read it.
      - uses: actions/cache@v4
        with:
          path: data/spine_sources
          key: spine-sources-${{ hashFiles('docs/spine/sources/official_documents.json') }}
      - run: ../../bin/testdb fresh "$DATABASE_URL"
      # Coverage below the floor in pyproject.toml ([tool.coverage.report] fail_under) fails the run.
      - run: uv run pytest -q --cov=engine --cov-report=term:skip-covered

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # PageProps / LayoutProps are global types Next generates during dev, build or typegen. A fresh
      # checkout has none, so tsc failed on every run from 2026-09-18 with "Cannot find name
      # 'LayoutProps'" while the engine job stayed green — and nobody was looking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Every warning is an error here: lint ran nowhere until 2026-10-01 (goals/p1-the-gates-hold.yaml).
      - run: npx eslint --max-warnings 0
      # No DATABASE_URL, as on Vercel's previews: a page's import must never touch the database (lib/db.ts). One did
      # (lib/queries-papers.ts, a fragment built at import), and every preview failed from #140 to #143 while this
      # build, handed a URL, passed.
      - run: npm run build

  # Every browser spec, against a production build and the engine (playwright.config.ts starts both), on a database
  # built from this repository alone — the engine job's `bin/testdb fresh`. Until 2026-10-01 these ran on a laptop
  # against a copy of live, some leaned on live's classes, and none ran here. A spec builds the rows it needs
  # (tests/rows.ts); one that skips itself fails this job (goals/p1-browser-tests-in-ci.yaml).
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub's official image from AWS's copy of it: Docker Hub refuses anonymous pulls past a
        # limit per address, and runners share addresses (2026-10-09: every job died before its first step, twice)
        image: public.ecr.aws/docker/library/postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: packages/engine
      # the engine prints a paper through Chromium (assess/render.py)
      - run: uv run playwright install --with-deps chromium
        working-directory: packages/engine
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bin/testdb fresh "$DATABASE_URL"
      # The website and the engine reach the database as their own roles, as live will, with passwords made for this
      # run alone; a page or a route needing a grant its role lacks fails here (goals/p1-the-roles-hold.yaml).
      - run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role app_web password 'ci-web'"
          -c "alter role app_engine password 'ci-engine'"
      - run: npx playwright test --reporter=list,json
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
      - name: no test skipped or left unrun
        working-directory: apps/web
        run: >-
          node -e "const s = require('./results.json').stats; console.log(s);
          if (s.skipped || s.unexpected || s.flaky) process.exit(1)"

