# What must hold before anything reaches main. The style is machine-enforced here (ruff format
# --check) so it cannot drift back into hand formatting. The engine suite runs against a database built
# from this repository alone (`bin/testdb fresh`: every migration, the seed, the question bank and the
# worksheet library), so a test that reads the database runs here instead of skipping itself.
# Deployment: Vercel deploys main on every merge, migrate.yml applies a merge's migrations to the live
# database, and deploy-engine.yml rebuilds the engine server.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/engine } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # the tests refuse any database that is not on this machine (conftest.py, core/db.py)
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The server builds with `uv sync --frozen`, which installs the lockfile and nothing else. A
      # lock missing boto3 passed every check here (a fresh resolve found it) and the deployed
      # engine could not start. The lock must match pyproject.toml, or the build is refused.
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv run ruff format --check engine tests
      - run: uv run ruff check engine tests
      # A paper is printed through Chromium (assess/render.py); the test that scans printed papers needs it.
      - run: uv run playwright install --with-deps chromium
      # The digit reader's models (ADR 0035, ~135 MB): test_digits and test_boxes run the real reader.
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-${{ hashFiles('packages/engine/uv.lock') }}
      # The spine's provenance check (goals/spine-traceable.yaml) reads NCERT's own PDFs (~69 MB), fetched from
      # ncert.nic.in and refused unless each matches the fingerprint recorded when the import read it.
      - uses: actions/cache@v4
        with:
          path: data/spine_sources
          key: spine-sources-${{ hashFiles('docs/spine/sources/official_documents.json') }}
      - run: ../../bin/testdb fresh "$DATABASE_URL"
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # PageProps / LayoutProps are global types Next generates during dev, build or typegen. A fresh
      # checkout has none, so tsc failed on every run from 2026-09-18 with "Cannot find name
      # 'LayoutProps'" while the engine job stayed green — and nobody was looking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
        env: { DATABASE_URL: "postgres://ci:ci@localhost:5432/ci" }
